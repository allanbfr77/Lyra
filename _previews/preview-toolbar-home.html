<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prévia — Barra de ações da Home (aplicado)</title>
<style>
  :root{
    --surface:#232328; --surface2:#2e2e35; --border:#3f3f48;
    --accent:#c49a3a; --text:#e7e4dc; --text-dim:#9a9690; --red:#d9534f;
    --font-ui:'Segoe UI',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#17171b;color:var(--text);font-family:var(--font-ui);padding:28px}
  h1{font-size:18px;font-weight:600;margin:0 0 4px}
  .sub{font-size:13px;color:var(--text-dim);margin:0 0 24px}
  .cap{font-size:12px;color:var(--text-dim);margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em}
  .bar{background:#1e1e22;border:1px solid #35353d;border-radius:10px;padding:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-ui);font-size:12px;font-weight:500;color:#d7d5cd;background:var(--surface2);border:1px solid #43434c;border-radius:6px;padding:6px 11px;cursor:pointer;white-space:nowrap;transition:all .15s}
  .btn svg{width:15px;height:15px;flex-shrink:0}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#20180a}
  .btn.primary:hover{background:#d4a94a}
  .btn.nav{padding:6px 8px}
  .btn.danger{color:var(--text-dim)}
  .btn.danger:hover{border-color:var(--red);color:#ffd8d3;background:rgba(176,48,40,.14)}
  .sep{width:1px;align-self:stretch;background:#3a3a42;margin:2px 4px}
</style>
</head>
<body>
  <h1>Barra de ações da Home — aplicado</h1>
  <p class="sub">Sentence case, cada ação com ícone SVG. Primária dourada, Sair vermelho no hover, setas só-ícone. Passe o mouse para ver os estados.</p>

  <div class="cap">Estado normal</div>
  <div class="bar">
    <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41 12 22l-9-9V3h10l7.59 7.59a2 2 0 0 1 0 2.82Z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Editar nome</button>
    <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>Apagar cópia</button>
    <div class="sep"></div>
    <button class="btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>Editar letra</button>
    <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Criar nova versão</button>
    <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h8M8 9h2"/></svg>Modo letra completa</button>
    <div class="sep"></div>
    <button class="btn nav" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="btn nav" aria-label="Próxima"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
    <button class="btn danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Sair</button>
  </div>

  <div class="cap">Modo edição</div>
  <div class="bar">
    <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>Novo slide</button>
    <button class="btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>Salvar alterações</button>
    <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>Encerrar edição</button>
  </div>
</body>
</html>
