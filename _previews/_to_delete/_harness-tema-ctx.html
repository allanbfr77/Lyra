<!doctype html><html><head><meta charset="utf-8"><style>:root {
      --slides-rail-height: 520px;
      /* Modo slides: piso da faixa de prévias — o arraste nunca encolhe abaixo disto. */
      --preview-mod-card-h-min: 172px;
      --bg: #f5f3ee;
      --surface: #ffffff;
      --surface2: #ebe8e2;
      --border: #d8d3c9;
      --accent: #a67c2d;
      --accent2: #7a5a1f;
      --text: #000000;
      --text-dim: #000000;
      --green: #2f7d4e;
      --red: #b03028;
      --yellow: #c48800;
      --on-accent: #1a1612;

      /* ── Dock de navegação — geometria (partilhada pelos dois temas) ── */
      --nav-dur: 0.18s;
      --nav-gap: 4px;
      --nav-dock-pad: 6px;
      --nav-dock-radius: 20px;
      --nav-item-radius: 14px;
      --nav-item-w: 90px;
      --nav-item-h: 58px;
      --nav-icon-size: 20px;
      /* Folga horizontal da cápsula à volta do ícone. */
      --nav-capsula-px: 13px;
      /* Folga vertical entre a pílula e as bordas do cabeçalho. */
      --nav-dock-respiro: 13px;

      /* ── Dock de navegação — cores (tema claro) ── */
      --nav-dock-bg: color-mix(in srgb, var(--surface2) 72%, var(--surface));
      --nav-dock-border: color-mix(in srgb, var(--border) 85%, transparent);
      --nav-dock-shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 10px 24px -16px rgb(0 0 0 / 0.35);
      --nav-item-fg: color-mix(in srgb, var(--text) 58%, transparent);
      --nav-item-fg-hover: var(--text);
      --nav-item-bg-hover: color-mix(in srgb, var(--text) 7%, transparent);
      --nav-item-active-bg: var(--surface);
      --nav-item-active-border: color-mix(in srgb, var(--border) 90%, transparent);
      --nav-item-active-fg: var(--text);
      --nav-item-active-shadow: 0 1px 2px rgb(0 0 0 / 0.08), 0 6px 14px -8px rgb(0 0 0 / 0.4);
      --nav-focus-ring: color-mix(in srgb, var(--accent) 70%, transparent);
      /* Deriva de --text, por isso serve os dois temas sem redefinição. */
      --nav-divisor: color-mix(in srgb, var(--text) 15%, transparent);

      /* ── Cores semânticas por modo (tema claro) ── */
      --mode-home: #8b7355;
      --mode-midias: #7c5cbf;
      --mode-biblia: #b8860b;
      --mode-slide: #2d8a6e;
      --mode-contagem: #b5603a;
      --mode-cfg: #5b7c99;
      --mode-tema: #4a6fa5;
      --mode-voz: color-mix(in srgb, var(--text) 72%, transparent);

      /* Prévia de slide na UI apenas — monitores físicos usam displayConfig.fontFamily. */
      --slide-font: 'CMG Sans', 'DM Sans', system-ui, sans-serif;
      /* Chrome da aplicação (menus, botões, formulários, tabelas). */
      --font-ui: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-mono: "Cascadia Code", "Cascadia Mono", Consolas, "Courier New", monospace;
      /* Escala tipográfica da UI — hierarquia consistente (não afecta projeção). */
      --fs-title: 20px;
      --fs-subtitle: 16px;
      --fs-body-base: 14px;
      --fs-text-base: 14px;
      --fs-label-base: 12px;
      --fs-section-base: 13px;
      --fs-caption-base: 12px;
      --fs-card-head-base: 11px;
      --fs-card-text-base: 13px;
      --fw-regular: 400;
      --fw-medium: 500;
      --fw-semibold: 600;
      --fw-bold: 700;
      --slide-chip-snippet-px-base: 14;
      --slide-chip-num-px-base: 20;
    }.playlist-tema-dd {
      position: relative;
      flex: 1 1 100%;
      min-width: 0;
      max-width: 100%;
    }
.playlist-tema-dd-btn {
      width: 100%;
      min-height: 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      box-sizing: border-box;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 6px;
      font-family: var(--font-ui);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      outline: none;
    }
.playlist-tema-dd-btn:hover { border-color: var(--accent2); }
.playlist-tema-dd.open .playlist-tema-dd-btn { border-color: var(--accent); }
.playlist-tema-dd-label {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
.playlist-tema-dd-caret {
      flex-shrink: 0;
      font-size: 11px;
      opacity: 0.8;
    }
.playlist-tema-dd-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 4px);
      margin: 0;
      padding: 6px 0;
      list-style: none;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      z-index: 30000;
      max-height: min(320px, 55vh);
      overflow-y: auto;
    }
.playlist-tema-dd-menu[hidden] { display: none !important; }
.playlist-tema-dd-item {
      display: block;
      width: 100%;
      padding: 10px 14px;
      margin: 0;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 14px;
      line-height: 1.4;
      text-align: left;
      cursor: pointer;
      box-sizing: border-box;
    }
.playlist-tema-dd-item:hover,
    .playlist-tema-dd-item:focus-visible {
      outline: none;
      background: rgba(166, 124, 45, 0.22);
    }
.playlist-tema-dd-item[aria-selected="true"] {
      background: rgba(166, 124, 45, 0.14);
    }
/* Menu de contexto dos temas (botão direito sobre um item da lista). */
    .playlist-tema-ctx-menu {
      position: fixed;
      z-index: 30050;
      min-width: 200px;
      padding: 6px 0;
      margin: 0;
      list-style: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }
.playlist-tema-ctx-menu[hidden] { display: none !important; }
.playlist-tema-ctx-titulo {
      padding: 4px 14px 8px;
      margin: 0 0 4px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 260px;
    }
.playlist-tema-ctx-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 9px 14px;
      border: none;
      background: transparent;
      color: var(--text);
      font-family: var(--font-ui);
      font-size: 13px;
      text-align: left;
      cursor: pointer;
      box-sizing: border-box;
    }
.playlist-tema-ctx-item svg {
      flex: 0 0 auto;
      display: block;
      opacity: 0.8;
      pointer-events: none;
    }
.playlist-tema-ctx-item:hover,
    .playlist-tema-ctx-item:focus-visible {
      outline: none;
      background: var(--surface2);
      color: var(--accent);
    }
.playlist-tema-ctx-item--perigo:hover,
    .playlist-tema-ctx-item--perigo:focus-visible {
      color: #ffd8d3;
      background: rgba(176, 48, 40, 0.18);
    }

          <div class="cfg-card-head"><span class="cfg-card-titulo">Servidor de projeção remoto</span></div>

            <div class="cfg-nota">
              Um PC com os monitores corre o app <b>Servidor</b>; o outro corre o Controlador e envia os comandos. Ao conectar, este Controlador deixa de projetar aqui e passa a comandar o Servidor — <b>apenas durante esta sessão</b>. Se o Servidor for fechado ou a ligação cair, o Controlador reassume sozinho o modo <b>Este PC</b> (motor local) — o badge e a projeção ficam alinhados, sem precisar reiniciar. Ao fechar e reabrir o app, o Lyra volta sempre a projetar nesta máquina, e é preciso conectar de novo. O interruptor <b>Lembrar IP</b> decide se o endereço fica preenchido na próxima abertura (ligado) ou se é apagado ao reiniciar (desligado). Para voltar ao padrão sem reiniciar use <b>Ferramentas › Projetar nesta máquina</b>. O estado da ligação aparece no badge no canto superior direito do painel (amarelo enquanto tenta ligar; verde quando ligado). A janela de Ajustes fecha automaticamente quando a ligação vinga.

<script>
window.__log = [];
let temaSelecionadoPorCulto = {}, cultoId = 'c1', playlists = { c1: [] };
const TEMA_PADRAO_ABERTURA = 'Abertura', PLAYLIST_TIPO_MARCADOR_TEMA = 'marcador-tema';
const normalizarTemaPlaylist = (v) => String(v ?? '').trim();
const getPlaylist = () => playlists.c1;
const garantirTemaNoCatalogoAtual = (t) => __log.push('catalogo:' + t);
const setTemaSelecionadoAtual = (t) => __log.push('sel:' + t);
const getTemaSelecionadoAtual = () => '';
const desmarcarAberturaRemovidaPeloUsuario = () => {};
const savePlaylists = () => __log.push('savePlaylists');
const renderSeletorTemasPlaylist = () => __log.push('renderSeletor');
const renderPlaylist = () => __log.push('renderPlaylist');
const aplicarSelecaoTemaNaUi = (v) => __log.push('aplicarUi:' + v);
const renomearTemaNoCulto = (a,b) => (__log.push('renomear:'+a+'->'+b), true);
const excluirTemaDoCulto = (t) => __log.push('excluir:' + t);
const appPrompt = async () => 'Louvor Inicial';
const appConfirm = async () => true;
const alert = (m) => __log.push('alert:' + m);
function fecharMenuContextoTemaPlaylist() {
  const m = document.getElementById('playlist-tema-ctx-menu');
  if (m) m.hidden = true;
  temaMenuContextoAtual = '';
}

function abrirMenuContextoTemaPlaylist(clientX, clientY, tema) {
  const menu = document.getElementById('playlist-tema-ctx-menu');
  const titulo = document.getElementById('playlist-tema-ctx-titulo');
  if (!menu) return;
  temaMenuContextoAtual = normalizarTemaPlaylist(tema);
  if (!temaMenuContextoAtual) return;
  if (titulo) titulo.textContent = temaMenuContextoAtual;
  menu.hidden = false;
  menu.style.left = '-9999px';
  menu.style.top = '0';
  const rect = menu.getBoundingClientRect();
  const pad = 8;
  let x = clientX;
  let y = clientY;
  if (x + rect.width + pad > window.innerWidth) x = Math.max(pad, window.innerWidth - rect.width - pad);
  if (y + rect.height + pad > window.innerHeight) y = Math.max(pad, window.innerHeight - rect.height - pad);
  menu.style.left = `${x}px`;
  menu.style.top = `${y}px`;
}

function inserirTemaNaPlaylistAtual(tema) {
  if (!cultoId) {
    alert('Selecione primeiro o dia do culto.');
    return;
  }
  const t = normalizarTemaPlaylist(tema);
  if (!t) {
    alert('Escolha um tema na lista antes de «Inserir tema na playlist abaixo».');
    return;
  }
  if (t === TEMA_PADRAO_ABERTURA) desmarcarAberturaRemovidaPeloUsuario(cultoId);
  const pl = getPlaylist(cultoId);
  pl.push({ tipo: PLAYLIST_TIPO_MARCADOR_TEMA, tema: t });
  garantirTemaNoCatalogoAtual(t);
  setTemaSelecionadoAtual(t);
  savePlaylists();
  renderSeletorTemasPlaylist();
  renderPlaylist();
}

async function renomearTemaPeloMenuContexto(tema) {
  if (!cultoId) {
    alert('Selecione primeiro o dia do culto.');
    return;
  }
  const atual = normalizarTemaPlaylist(tema);
  if (!atual) return;
  const novo = await appPrompt('Novo nome do tema:', {
    title: 'Editar nome do tema',
    defaultValue: atual,
    emptyMsg: 'Digite o novo nome do tema.',
  });
  if (!novo || novo === atual) return;
  if (!renomearTemaNoCulto(atual, novo)) return;
  renderSeletorTemasPlaylist();
  renderPlaylist();
  if (getTemaSelecionadoAtual() === novo) aplicarSelecaoTemaNaUi(novo);
}

async function excluirTemaPeloMenuContexto(tema) {
  if (!cultoId) {
    alert('Selecione primeiro o dia do culto.');
    return;
  }
  const t = normalizarTemaPlaylist(tema);
  if (!t) return;
  const ok = await appConfirm(
    `Excluir o tema «${t}»? Todas as músicas inseridas nesse tema serão removidas da playlist deste culto.`,
    'Excluir tema'
  );
  if (!ok) return;
  excluirTemaDoCulto(t);
  renderSeletorTemasPlaylist();
  renderPlaylist();
}

function configurarMenuContextoTemaPlaylist() {
  const menu = document.getElementById('playlist-tema-ctx-menu');
  if (!menu) return;

  document.getElementById('playlist-tema-ctx-inserir')?.addEventListener('click', () => {
    const t = temaMenuContextoAtual;
    fecharMenuContextoTemaPlaylist();
    fecharDropdownTemaPlaylist();
    inserirTemaNaPlaylistAtual(t);
  });

  document.getElementById('playlist-tema-ctx-renomear')?.addEventListener('click', () => {
    const t = temaMenuContextoAtual;
    fecharMenuContextoTemaPlaylist();
    fecharDropdownTemaPlaylist();
    renomearTemaPeloMenuContexto(t).catch(() => {});
  });

  document.getElementById('playlist-tema-ctx-excluir')?.addEventListener('click', () => {
    const t = temaMenuContextoAtual;
    fecharMenuContextoTemaPlaylist();
    fecharDropdownTemaPlaylist();
    excluirTemaPeloMenuContexto(t).catch(() => {});
  });

  document.addEventListener('click', (e) => {
    if (!menu.hidden && !menu.contains(e.target)) fecharMenuContextoTemaPlaylist();
  });
  // Outro botão direito fora do menu fecha o que estava aberto (o handler do item reabre em seguida).
  document.addEventListener('contextmenu', (e) => {
    if (!menu.hidden && !menu.contains(e.target)) fecharMenuContextoTemaPlaylist();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !menu.hidden) fecharMenuContextoTemaPlaylist();
  });
  window.addEventListener('resize', () => fecharMenuContextoTemaPlaylist());
  window.addEventListener('blur', () => fecharMenuContextoTemaPlaylist());
}

function fecharDropdownTemaPlaylist() {
  const wrap = document.getElementById('playlist-tema-dd');
  const menu = document.getElementById('playlist-tema-dd-menu');
  const btn = document.getElementById('playlist-tema-dd-btn');
  if (wrap) wrap.classList.remove('open');
  if (menu) menu.hidden = true;
  if (btn) btn.setAttribute('aria-expanded', 'false');
}
document.querySelectorAll('.playlist-tema-dd-item').forEach((b) => {
  b.addEventListener('contextmenu', (ev) => {
    const t = normalizarTemaPlaylist(b.dataset.value || '');
    if (!t) return;
    ev.preventDefault(); ev.stopPropagation();
    abrirMenuContextoTemaPlaylist(ev.clientX, ev.clientY, t);
  });
});
configurarMenuContextoTemaPlaylist();
</script></body></html>
