<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lyra — OBS Bíblia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Sem cor de fundo fixa — overlay transparente por padrão.
       Defina um fundo pelo campo "Custom CSS" da Browser Source no OBS, se quiser. */
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    /* Bloco da Bíblia — some quando não há versículo em projeção */
    .biblia-wrap {
      width: 100%;
      padding: 12px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      /* Animação de entrada/saída */
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    /* Classe adicionada pelo JS quando há versículo */
    .biblia-wrap.visivel {
      opacity: 1;
      transform: translateY(0);
    }

    .biblia-texto {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: var(--obs-font-size, 4.5vw);
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: var(--obs-line-spacing, 1.3);
      text-shadow:
        0 2px 8px rgba(0,0,0,0.9),
        0 0 32px rgba(0,0,0,0.7),
        2px 2px 0 rgba(0,0,0,0.5);
      white-space: pre-wrap;
      max-width: 92%;
    }

    .biblia-referencia {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: var(--obs-referencia-font-size, 1.6vw);
      font-weight: 600;
      color: #ffd76b;
      text-align: center;
      letter-spacing: 0.04em;
      text-shadow:
        0 2px 6px rgba(0,0,0,0.9),
        0 0 20px rgba(0,0,0,0.7);
      margin-top: 14px;
    }

    #obs-status {
      display: none;
    }
  </style>
</head>
<body>
  <div class="biblia-wrap" id="biblia-wrap">
    <div class="biblia-texto" id="biblia-texto"></div>
    <div class="biblia-referencia" id="biblia-referencia"></div>
  </div>
  <div id="obs-status"></div>

  <script>
    function resolverUrlServidorLyrics() {
      const qs = new URLSearchParams(window.location.search || '');
      const fromQuery = (qs.get('server') || '').trim();
      if (fromQuery) {
        if (/^https?:\/\//i.test(fromQuery)) return fromQuery.replace(/\/+$/, '');
        if (/^[\w.-]+:\d+$/i.test(fromQuery)) return `http://${fromQuery}`;
        return `http://${fromQuery.replace(/\/+$/, '')}:5510`;
      }
      try {
        const fromLs = (localStorage.getItem('lyra_obs_server_url') || '').trim();
        if (fromLs) {
          if (/^https?:\/\//i.test(fromLs)) return fromLs.replace(/\/+$/, '');
          if (/^[\w.-]+:\d+$/i.test(fromLs)) return `http://${fromLs}`;
          return `http://${fromLs.replace(/\/+$/, '')}:5510`;
        }
      } catch (_) {}
      const host = window.location.hostname || 'localhost';
      const proto = window.location.protocol === 'https:' ? 'https:' : 'http:';
      return `${proto}//${host}:5510`;
    }

    const SERVER_URL   = resolverUrlServidorLyrics();
    const elWrap       = document.getElementById('biblia-wrap');
    const elTexto      = document.getElementById('biblia-texto');
    const elReferencia = document.getElementById('biblia-referencia');
    const elStatus      = document.getElementById('obs-status');
    let fadeTimer;
    let socket = null;

    function setStatus(msg, cls) {
      elStatus.textContent = msg;
      elStatus.className = cls ? cls : '';
    }

    /**
     * Reage ao estado dedicado de Bíblia para OBS (`estado_biblia_obs`), que
     * espelha o versículo em projeção em qualquer canal físico (público ou
     * ministrante) — ignora música, aviso e apresentação.
     */
    function atualizar(estado) {
      clearTimeout(fadeTimer);
      elWrap.classList.remove('visivel');

      fadeTimer = setTimeout(() => {
        const ehBiblia = !!estado && estado.tipo === 'biblia';
        const vazio =
          !ehBiblia ||
          estado.telaLimpa ||
          estado.blackout ||
          estado.slidePretoFinal ||
          !Array.isArray(estado.linhas) ||
          estado.linhas.length === 0;

        if (vazio) {
          elTexto.textContent = '';
          elReferencia.textContent = '';
          setStatus(`Ligado a ${SERVER_URL} — à espera de um versículo.`, 'ok');
          return;
        }

        elTexto.textContent = estado.linhas.join('\n');
        elReferencia.textContent = estado.titulo || '';
        elWrap.classList.add('visivel');
        setStatus(`Ligado a ${SERVER_URL}`, 'ok');
      }, 120);
    }

    function conectar() {
      if (!window.io) {
        setStatus('Falha: socket.io não carregou. Verifique ' + SERVER_URL, 'erro');
        return;
      }

      socket = io(SERVER_URL, {
        path: '/socket.io',
        transports: ['websocket', 'polling'],
        reconnectionDelay: 2000,
        reconnectionAttempts: Infinity,
      });

      socket.on('connect', () => {
        setStatus('Socket ligado — ' + SERVER_URL, 'ok');
        socket.emit('get_estado');
      });

      socket.on('connect_error', (err) => {
        setStatus(
          'Erro ao ligar a ' + SERVER_URL + ' — ' + (err && err.message ? err.message : 'rede/firewall?'),
          'erro'
        );
      });

      socket.on('estado_biblia_obs', atualizar);

      socket.on('disconnect', () => {
        elWrap.classList.remove('visivel');
        setStatus('Desligado do servidor.', 'erro');
      });
    }

    function carregarSocketIO() {
      setStatus('A carregar socket.io de ' + SERVER_URL + ' …', '');
      const script = document.createElement('script');
      script.src = `${SERVER_URL}/socket.io/socket.io.js`;

      script.onload = () => conectar();

      script.onerror = () => {
        setStatus(
          'Não foi possível carregar ' + SERVER_URL + '/socket.io/socket.io.js (servidor a correr na 5510? Firewall?)',
          'erro'
        );
        setTimeout(carregarSocketIO, 3000);
      };

      document.head.appendChild(script);
    }

    setStatus('Página OBS Bíblia — API: ' + SERVER_URL, '');
    carregarSocketIO();
  </script>
</body>
</html>
