<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Lyra — Ministrante</title>
  <style>
    @font-face {
      font-family: 'CMG Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('CMG Sans'), local('CMGSans-Regular'), url('./fonts/CMGSans-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'CMG Sans';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: local('CMG Sans Bold'), local('CMGSans-Bold'), url('./fonts/CMGSans-Bold.woff2') format('woff2');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /*
     * Preto desde o primeiro quadro pintado.
     *
     * O `body` era `transparent`, herança de quando esta janela nascia com
     * `transparent: true` — o motor passou a abri-la opaca por causa do vídeo. Com o
     * fundo transparente e sem fundo no `html`, o primeiro quadro composto não tinha cor
     * nenhuma e saía branco: era o clarão que aparecia ao abrir o programa e ao trocar de
     * modo, antes de o `display_config` chegar por IPC e o JS pintar o fundo de verdade.
     *
     * O JS continua a mandar aqui (`document.body.style.background`, mais abaixo): isto é
     * só o valor até ele falar.
     */
    html { background: #000000; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: 'CMG Sans', 'DM Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3vw 4vw;
      cursor: none;
    }
    body.slide-preto-final {
      background: #000000 !important;
      padding: 0;
    }
    body.slide-preto-final .wrap {
      background: transparent !important;
    }
    body.slide-preto-final .slide,
    body.slide-preto-final .ref-biblica-op,
    body.slide-preto-final .titulo-musica-op {
      visibility: hidden !important;
      opacity: 0 !important;
    }
    .wrap {
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: center;
      gap: 2.8vh;
      position: relative;
      padding: 0 2vw;
      box-sizing: border-box;
      /*
       * Sem `overflow: hidden`. Num contentor flex isso recorta a tinta do glifo
       * (side bearing do “O” em CMG Sans Bold) mesmo quando o `scrollWidth` cabe.
       * O `body` já recorta o ecrã; a folga lateral fica no padding do wrap/slide.
       */
      overflow: visible;
    }
    .slide {
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      /* Folga só da tinta (side bearing / antialiasing), sem encolher a fonte. */
      padding-inline: 0.08em;
      flex-shrink: 0;
      align-self: stretch;
      white-space: pre-wrap;
      text-transform: uppercase;
      font-weight: 700;
      line-height: 1.35;
      font-size: 4.1vh;
      display: block;
      text-align: center;
      overflow-wrap: break-word;
      word-break: normal;
      overflow: visible;
      text-shadow: 0 2px 28px rgba(28, 22, 22, 0.12);
    }
    #atual { color: #ffffff; transition: opacity 150ms ease; }
    #proximo {
      color: #f3c15a;
    }
    /*
     * Título da música no 1.º slide — primeiro item da pilha, não uma camada solta.
     *
     * Era `position: absolute; top: 1.2vh`, encostado ao topo do ecrã enquanto a letra se
     * centrava na altura toda. A distância entre os dois não era escolhida por ninguém:
     * saía do tamanho do bloco de letra, e num slide curto abria um vazio enorme.
     *
     * No fluxo, título e letra centram-se JUNTOS e a distância é a que `margin-bottom`
     * disser — uma linha da letra, calculada em `aplicarRespiroTituloAberturaOp`.
     */
    .titulo-musica-op {
      width: 100%;
      max-width: 100%;
      flex-shrink: 0;
      box-sizing: border-box;
      text-align: center;
      font-weight: 700;
      font-size: 7vh;
      line-height: 1.3;
      color: #f3c15a;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 28px rgba(28, 22, 22, 0.12);
    }
    .titulo-musica-op.oculta {
      display: none;
    }
    .linha-ministrante {
      display: block;
      /* A tinta do “O” sai da caixa de avance; não recorta o glifo. */
      padding-inline: 0.04em;
      box-sizing: border-box;
    }
    /*
     * Cor do comentário — SEM `var()`, de propósito.
     *
     * `color: var(--x, #00c8ff)` não faz o que parece. O fallback do `var()` só entra quando
     * a custom property NUNCA foi definida. Se ela existir com um valor que não seja um
     * <color> válido (um número, um hex sem `#`, uma string vazia que passou por um `||`),
     * a declaração fica «inválida no tempo de computação» e a regra CSS diz que a
     * propriedade assume o valor HERDADO — ou seja, a cor do contentor: branco em `#atual`,
     * dourado em `#proximo`. É exactamente a piscada relatada: o comentário aparece com a
     * cor do slide e só depois assume a cor configurada.
     *
     * Aqui fica o literal de fábrica e nada mais. A cor do utilizador chega por `style`
     * inline no render (`htmlTextoMinistranteComComentarios`), que tem prioridade e não
     * depende de nenhuma variável poder estar corrompida.
     */
    .linha-ministrante-comentario,
    #atual .linha-ministrante-comentario,
    #proximo .linha-ministrante-comentario {
      font-style: italic;
      color: #00c8ff;
    }
    .ref-biblica-op {
      width: 100%;
      max-width: 100%;
      flex-shrink: 0;
      text-align: center;
      font-weight: 600;
      font-size: 1.8vh;
      color: #fbf904;
      line-height: 1.35;
      text-transform: none;
      letter-spacing: 0.02em;
      margin-top: 0.6vh;
      transition: opacity 150ms ease;
    }

    @media (prefers-reduced-motion: reduce) {
      #atual,
      .ref-biblica-op { transition: none; }
    }
    .ref-biblica-op.oculta {
      display: none !important;
    }
    .vazio {
      opacity: 0.35;
      font-weight: 600;
    }
    .capa-apresentacao-op,
    .capa-aviso-op {
      position: fixed;
      inset: 0;
      z-index: 400;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      overflow: hidden;
    }
    .capa-apresentacao-op[hidden],
    .capa-aviso-op[hidden] {
      display: none !important;
    }

    /* ─── Contagem regressiva ───
       Cobre o monitor inteiro, como o aviso. As classes de dentro (`contagem-digitos`,
       `contagem-msg`, `piscando`) têm os mesmos nomes do telão de propósito: é o mesmo
       `contagemRender.js` que as escreve nas duas telas. */
    .capa-contagem-op {
      position: fixed;
      inset: 0;
      z-index: 400;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.2vh;
      padding: 4vh 4vw;
      box-sizing: border-box;
      overflow: hidden;
      text-align: center;
      background: var(--bg-contagem-projecao, #000000);
    }
    .capa-contagem-op[hidden] { display: none !important; }
    .capa-contagem-op.pos-top    { justify-content: flex-start; }
    .capa-contagem-op.pos-bottom { justify-content: flex-end; }

    .capa-contagem-op .contagem-msg {
      max-width: 92%;
      line-height: 1.25;
      letter-spacing: 0.04em;
      font-weight: 600;
    }
    .capa-contagem-op .contagem-msg:empty { display: none; }

    /* `tabular-nums`: sem ele o 1 é mais estreito do que o 8 e a linha dança a cada
       segundo — no palco isso lê-se como instabilidade. */
    .capa-contagem-op .contagem-digitos {
      line-height: 1;
      font-variant-numeric: tabular-nums;
      font-feature-settings: 'tnum' 1;
      white-space: nowrap;
    }

    .capa-contagem-op.piscando .contagem-digitos {
      animation: contagem-pisca-op 1s steps(1, end) infinite;
    }

    @keyframes contagem-pisca-op {
      0%, 49%   { opacity: 1; }
      50%, 100% { opacity: 0.15; }
    }

    @media (prefers-reduced-motion: reduce) {
      .capa-contagem-op.piscando .contagem-digitos { animation: none; }
    }
    .capa-apresentacao-op img,
    .capa-apresentacao-op video,
    .capa-apresentacao-op iframe {
      width: 100%;
      height: 100%;
      border: 0;
      object-fit: contain;
      background: #000000;
    }
    .capa-aviso-op pre {
      margin: 0;
      padding: 4vh 5vw;
      max-width: 92vw;
      max-height: 88vh;
      overflow: hidden;
      font-family: 'CMG Sans', 'DM Sans', system-ui, sans-serif;
      font-size: min(4.2vw, 5.5vh);
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
      white-space: pre-wrap;
      text-align: center;
      background: transparent;
      border: none;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="capa-apresentacao-op" class="capa-apresentacao-op" hidden></div>
  <div id="capa-aviso-op" class="capa-aviso-op" hidden><pre id="capa-aviso-op-texto"></pre></div>
  <div id="capa-contagem-op" class="capa-contagem-op" hidden>
    <div class="contagem-msg" id="capa-contagem-op-topo"></div>
    <div class="contagem-digitos" id="capa-contagem-op-digitos"></div>
    <div class="contagem-msg" id="capa-contagem-op-rodape"></div>
  </div>
  <div class="wrap" id="op-wrap-letras">
    <div class="titulo-musica-op oculta" id="titulo-musica-op"></div>
    <div class="slide vazio" id="atual"></div>
    <div class="ref-biblica-op oculta" id="ref-biblica-op"></div>
    <div class="slide vazio" id="proximo"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const elAtual = document.getElementById('atual');
    const elTituloMusicaOp = document.getElementById('titulo-musica-op');
    const elRefBiblicaOp = document.getElementById('ref-biblica-op');
    const elProximo = document.getElementById('proximo');
    const elCapaAp = document.getElementById('capa-apresentacao-op');
    const elCapaAviso = document.getElementById('capa-aviso-op');
    const elCapaAvisoTexto = document.getElementById('capa-aviso-op-texto');
    const elCapaContagem = document.getElementById('capa-contagem-op');

    /*
     * Contagem: o MESMO desenho do telão, não uma segunda implementação.
     *
     * Quando o operador manda a contagem para os dois monitores, a sala e o palco ficam a
     * ver o mesmo relógio ao mesmo tempo — dois códigos a contar em paralelo acabariam,
     * mais cedo ou mais tarde, a discordar de um segundo bem à vista de toda a gente.
     *
     * O `try` protege o arranque: se o módulo faltar, esta tela perde a contagem mas
     * continua a mostrar letra e versículo, que é o essencial do monitor do ministrante.
     */
    let contagemRender = null;
    try {
      contagemRender = require('./js/contagemRender').criarRenderContagem({
        document,
        performance: window.performance,
        elBox: elCapaContagem,
        elDigitos: document.getElementById('capa-contagem-op-digitos'),
        elMsgTopo: document.getElementById('capa-contagem-op-topo'),
        elMsgRodape: document.getElementById('capa-contagem-op-rodape'),
      });
    } catch (e) {
      console.error('[Lyra] contagem indisponível no monitor do ministrante:', e && e.message);
    }

    function limparContagemMinistrante() {
      if (contagemRender) contagemRender.limpar();
      else if (elCapaContagem) elCapaContagem.hidden = true;
    }
    const elWrapLetras = document.getElementById('op-wrap-letras');
    let slideFit = null;
    let viewportDaJanela = null;
    try {
      slideFit = require('./js/slideFit');
    } catch (e) {
      console.error('[Lyra] slideFit indisponível no monitor do ministrante:', e && e.message);
    }
    try {
      viewportDaJanela = require('./js/viewportDaJanela');
    } catch (e) {
      console.error('[Lyra] viewportDaJanela indisponível no monitor do ministrante:', e && e.message);
    }
    let ultimoPayloadMinistrante = null;
    let displayConfig = {
      fontSize: 5,
      lineSpacing: 1.7,
      ministrante: {
        bgType: 'solid',
        bgColor: '#000000',
        bgGradient: 'linear-gradient(135deg, #000000 0%, #161616 100%)',
        bgImage: '',
        textColorAtual: '#ffffff',
        textColorProximo: '#f3c15a',
        commentColor: '#00c8ff',
        aberturaTituloColor: '#f3c15a',
        aberturaTituloFontSize: 7,
        fontSize: 4.1,
        fontSizeAtual: 4.1,
        fontSizeProximo: 4.1,
        lineSpacing: 1.35,
        wrapLongLines: true,
        autoFitLongLines: false,
      },
      clock: {
        format: 'HH:MM',
        fontSize: 13,
        showClock: true,
        monitorRelogio: 'ministrante',
        bgType: 'solid',
        bgColor: '#000000',
        bgGradient: 'linear-gradient(135deg, #1a1816 0%, #2c2420 100%)',
        bgImage: '',
        textColor: '#ffffff',
        dateColor: '#ffffff',
        verseColor: '#ffffff',
      },
    };

    function aplicarPosicaoConteudoMinistrante(mon, ehBiblia) {
      if (!elWrapLetras) return;
      if (!ehBiblia) {
        elWrapLetras.style.justifyContent = 'center';
        elWrapLetras.style.alignItems = 'stretch';
        return;
      }
      const posY = mon.posY || 'center';
      const posX = mon.posX || 'center';
      if (posY === 'top') elWrapLetras.style.justifyContent = 'flex-start';
      else if (posY === 'bottom') elWrapLetras.style.justifyContent = 'flex-end';
      else elWrapLetras.style.justifyContent = 'center';
      if (posX === 'left') elWrapLetras.style.alignItems = 'flex-start';
      else if (posX === 'right') elWrapLetras.style.alignItems = 'flex-end';
      else elWrapLetras.style.alignItems = 'center';
    }

    function normalizarCorHexAviso(valor, fallback) {
      const s = String(valor || '').trim();
      return /^#[0-9a-fA-F]{6}$/.test(s) ? s.toLowerCase() : fallback;
    }

    function normalizarCfgAviso(raw) {
      const cfg = raw && typeof raw === 'object' ? raw : {};
      const fontSize = Number(cfg.fontSize);
      return {
        fontSize: Number.isFinite(fontSize) ? Math.min(40, Math.max(2.2, fontSize)) : 5.5,
        textColor: normalizarCorHexAviso(cfg.textColor, '#ffffff'),
        backgroundColor: normalizarCorHexAviso(cfg.backgroundColor, '#000000'),
        transparentBackground: cfg.transparentBackground === true,
        wrapLongLines: cfg.wrapLongLines !== false,
        italic: cfg.italic === true,
        verticalPosition:
          cfg.verticalPosition === 'top' || cfg.verticalPosition === 'bottom'
            ? cfg.verticalPosition
            : 'center',
      };
    }

    function aplicarEstiloAvisoMinistrante(rawCfg) {
      const cfg = normalizarCfgAviso(rawCfg);
      elCapaAviso.style.background = cfg.transparentBackground ? 'transparent' : cfg.backgroundColor;
      if (cfg.verticalPosition === 'top') elCapaAviso.style.alignItems = 'flex-start';
      else if (cfg.verticalPosition === 'bottom') elCapaAviso.style.alignItems = 'flex-end';
      else elCapaAviso.style.alignItems = 'center';
      elCapaAvisoTexto.style.color = cfg.textColor;
      elCapaAvisoTexto.style.fontStyle = cfg.italic ? 'italic' : 'normal';
      elCapaAvisoTexto.style.fontSize = `${cfg.fontSize}vh`;
      elCapaAvisoTexto.style.whiteSpace = cfg.wrapLongLines ? 'pre-wrap' : 'pre';
      elCapaAvisoTexto.style.overflowWrap = cfg.wrapLongLines ? 'anywhere' : 'normal';
      elCapaAvisoTexto.style.wordBreak = cfg.wrapLongLines ? 'break-word' : 'normal';
      elCapaAvisoTexto.style.overflow = 'hidden';
      return cfg;
    }

    function deveRevelarRelogioMinistrante() {
      const clk = displayConfig.clock || {};
      if (clk.showClock === false) return false;
      const alvo = String(clk.monitorRelogio || 'ministrante').toLowerCase();
      return alvo === 'ministrante' || alvo === 'ambos';
    }

    function aplicarFundoMinistrantePorProjecao(ativa) {
      const mon = displayConfig.ministrante || {};
      if (!ativa) {
        /* Opaca: relógio ocioso é revelado escondendo a janela (main), não via transparent. */
        document.body.style.background = '#000000';
        return;
      }
      if (mon.bgType === 'gradient') {
        document.body.style.background = mon.bgGradient || '#000000';
      } else if (mon.bgType === 'image' && mon.bgImage) {
        document.body.style.background = `url('${mon.bgImage}') center/cover no-repeat`;
      } else {
        document.body.style.background = mon.bgColor || '#000000';
      }
    }

    function normalizarReferenciaBiblicaMinistrante(valor) {
      if (valor == null) return '';
      const ref = String(valor).trim();
      if (!ref) return '';
      const lower = ref.toLowerCase();
      return lower === 'null' || lower === 'undefined' ? '' : ref;
    }

    function aplicarReferenciaBiblicaMinistrante(tituloRef, modoPayload) {
      if (!elRefBiblicaOp) return;
      const mon = displayConfig.ministrante || {};
      const ref = normalizarReferenciaBiblicaMinistrante(tituloRef);
      const ehBiblia = modoPayload === 'biblia';
      const mostrar = ehBiblia && mon.refMostrar !== false && !!ref;
      if (!mostrar) {
        elRefBiblicaOp.textContent = '';
        elRefBiblicaOp.classList.add('oculta');
        return;
      }
      elRefBiblicaOp.classList.remove('oculta');
      elRefBiblicaOp.textContent = ref;
      elRefBiblicaOp.style.color = mon.refColor || '#fbf904';
      const refVw = Number(mon.refFontSize);
      const refVh = Number.isFinite(refVw) && refVw > 0 ? refVw * 0.95 : 1.7;
      elRefBiblicaOp.style.fontSize = `${refVh}vh`;
      elRefBiblicaOp.style.textTransform = 'none';
    }

    /** Cor e tamanho do título do 1.º slide — aplicados na config, como atual/próximo. */
    /** O `gap` que o flex já põe entre os filhos de `.wrap`, em vh — acompanha o CSS. */
    const GAP_SLIDES_VH = 2.8;

    /** `line-height` da letra — acompanha o `.slide` no CSS. */
    const LINE_HEIGHT_SLIDE = 1.35;

    /**
     * Separa o título da letra por exactamente uma linha em branco.
     *
     * «Uma linha» é medida na letra, não no título: é o texto de baixo que dá a escala com
     * que o olho lê o espaço, e é lá que uma linha vazia teria a altura que tem.
     *
     * O `gap` do flex já separa os dois; a margem só acrescenta o que falta para chegar a
     * uma linha. Somar a linha inteira por cima do gap daria quase duas.
     */
    function aplicarRespiroTituloAberturaOp() {
      if (!elTituloMusicaOp || elTituloMusicaOp.classList.contains('oculta')) return;
      const mon = displayConfig.ministrante || {};
      /*
       * A fonte EFECTIVA do slide, não a da config: o auto-fit encolhe-a quando a letra é
       * comprida, e uma linha medida na config ficaria maior do que a linha que está mesmo
       * no ecrã — logo naquelas músicas onde o espaço já é escasso.
       */
      const fonteEfetiva = parseFloat(elAtual && elAtual.style.fontSize);
      const fonteVh = Number.isFinite(fonteEfetiva) && fonteEfetiva > 0
        ? fonteEfetiva
        : Math.max(2.2, Number(mon.fontSizeAtual ?? mon.fontSize ?? 4.1));
      const linhaVh = fonteVh * LINE_HEIGHT_SLIDE;
      /* Fonte pequena com gap grande já chega a uma linha — nesse caso não se acrescenta
         nada, em vez de encolher o gap e aproximar mais do que o pedido. */
      const faltaVh = Math.max(0, linhaVh - GAP_SLIDES_VH);
      elTituloMusicaOp.style.marginBottom = `${faltaVh.toFixed(2)}vh`;
    }

    function aplicarEstiloTituloAberturaOp() {
      if (!elTituloMusicaOp) return;
      const mon = displayConfig.ministrante || {};
      const cor = String(mon.aberturaTituloColor || '').trim() || '#f3c15a';
      const vh = Number(mon.aberturaTituloFontSize);
      const fontVh = Number.isFinite(vh) && vh > 0 ? Math.min(20, vh) : 7;
      elTituloMusicaOp.style.color = cor;
      elTituloMusicaOp.style.fontSize = `${fontVh}vh`;
    }

    /** Título da música no topo do M3 — só no 1.º slide. */
    function aplicarTituloMusicaAbertura(payload) {
      if (!elTituloMusicaOp) return;
      const modo = String(payload?.modo || '');
      const tit = String(payload?.titulo || '').trim();
      const mostrar =
        !!payload?.aberturaMusica &&
        !!tit &&
        modo !== 'biblia' &&
        modo !== 'apresentacao' &&
        modo !== 'aviso' &&
        modo !== 'contagem';
      if (!mostrar) {
        elTituloMusicaOp.textContent = '';
        elTituloMusicaOp.classList.add('oculta');
        return;
      }
      elTituloMusicaOp.classList.remove('oculta');
      elTituloMusicaOp.textContent = tit.toUpperCase();
      aplicarEstiloTituloAberturaOp();
      aplicarRespiroTituloAberturaOp();
    }

    function substituirCamadaDisplay(atual, camada) {
      if (!camada || typeof camada !== 'object') return atual || {};
      const base = atual && typeof atual === 'object' ? { ...atual } : {};
      const bgType = camada.bgType != null ? camada.bgType : base.bgType || 'solid';
      const merged = { ...base, ...camada, bgType };
      merged.bgColor = camada.bgColor != null ? camada.bgColor : base.bgColor;
      merged.bgGradient = camada.bgGradient != null ? camada.bgGradient : base.bgGradient;
      if (bgType === 'image') {
        const imgPatch = camada.bgImage;
        const imgBase = base.bgImage;
        if (imgPatch != null && String(imgPatch).length > 0) {
          merged.bgImage = String(imgPatch);
        } else if (imgBase != null && String(imgBase).length > 0) {
          merged.bgImage = String(imgBase);
        } else {
          merged.bgImage = '';
        }
      } else {
        merged.bgImage = '';
      }
      return merged;
    }

    function payloadMinistranteTemConteudoAtivo(payload) {
      if (!payload || payload.telaLimpa) return false;
      /* Slide preto / blackout: projeção activa sem letra — não cair no modo ocioso/relógio. */
      if (payload.slidePretoFinal || payload.blackout) return true;
      if (typeof payload.projecaoAtiva === 'boolean') return payload.projecaoAtiva;
      const modo = String(payload.modo || 'texto');
      if (modo === 'apresentacao') {
        return !!String(payload?.apresentacao?.src || '').trim();
      }
      if (modo === 'aviso') {
        return Array.isArray(payload.linhas) && payload.linhas.length > 0;
      }
      /* Sem isto o monitor cairia no modo ocioso (relógio) por não haver letra — e o
         relógio taparia a contagem. */
      if (modo === 'contagem') return !!payload.contagem;
      return !!(String(payload.atual || '').trim() || String(payload.proximo || '').trim());
    }

    /**
     * Assinatura da config aplicada. Reenviar bytes idênticos é repintar por nada — e o
     * `atualizar` de CADA estrofe manda `display_config` antes do conteúdo (ver
     * `commandApplier.atualizar`). Sem esta guarda, cada troca de slide reconstruía o HTML
     * do slide ANTERIOR (com nova passagem de auto-fit) num frame e o do novo slide no
     * frame seguinte: dois `innerHTML` completos, dois repaints — a piscada do comentário.
     * Mesma técnica já usada no relógio (`enviarDisplayConfigParaJanelasRelogio`).
     */
    let assinaturaConfigMinistranteAplicada = null;

    function assinaturaConfigMinistrante(cfg) {
      try {
        return JSON.stringify(cfg);
      } catch (_) {
        return null;
      }
    }

    function aplicarConfig(cfg) {
      if (!cfg) return;
      displayConfig = {
        ...displayConfig,
        ...cfg,
        publico:
          cfg.publico !== undefined
            ? substituirCamadaDisplay(displayConfig.publico, cfg.publico)
            : { ...(displayConfig.publico || {}) },
        ministrante:
          cfg.ministrante !== undefined
            ? substituirCamadaDisplay(displayConfig.ministrante, cfg.ministrante)
            : { ...(displayConfig.ministrante || {}) },
        clock: { ...displayConfig.clock, ...(cfg.clock || {}) },
      };
      const mon = displayConfig.ministrante || {};
      /* Fallback = cor já aplicada, nunca o default: uma config sem `commentColor` (ou com
         valor inválido) não pode rebaixar a escolha do utilizador para o azul de fábrica. */
      const corComentario = normalizarCorComentarioMinistrante(
        mon.commentColor,
        corComentarioMinistranteAplicada
      );
      mon.commentColor = corComentario;
      displayConfig.ministrante = mon;
      /* Só a camada `ministrante` — é a única que esta função lê. Assinar a config inteira
         arrastaria o base64 do fundo do telão a cada estrofe, sem nada a decidir com ele. */
      const assinatura = assinaturaConfigMinistrante(mon);
      if (assinatura !== null && assinatura === assinaturaConfigMinistranteAplicada) return;
      assinaturaConfigMinistranteAplicada = assinatura;
      definirCorComentarioMinistrante(corComentario);
      aplicarEstiloTituloAberturaOp();
      elAtual.style.color = mon.textColorAtual || '#ffffff';
      elProximo.style.color = mon.textColorProximo || '#f3c15a';
      const baseAtualVh = Math.max(2.2, Number(mon.fontSizeAtual ?? mon.fontSize ?? 4.1));
      const baseProximoVh = Math.max(2.2, Number(mon.fontSizeProximo ?? mon.fontSize ?? 4.1));
      elAtual.style.fontSize = `${baseAtualVh}vh`;
      elProximo.style.fontSize = `${baseProximoVh}vh`;
      elAtual.style.lineHeight = String(mon.lineSpacing || 1.35);
      elProximo.style.lineHeight = String(mon.lineSpacing || 1.35);
      const wrap = mon.wrapLongLines !== false;
      if (!wrap) {
        elAtual.style.whiteSpace = 'pre';
        elAtual.style.overflowWrap = 'normal';
        elAtual.style.wordBreak = 'normal';
        elProximo.style.whiteSpace = 'pre';
        elProximo.style.overflowWrap = 'normal';
        elProximo.style.wordBreak = 'normal';
      } else {
        /* `anywhere` parte a palavra para encher a linha e encosta o último
           glifo à borda — a tinta do “O” sai da caixa e é recortada. */
        elAtual.style.whiteSpace = 'pre-wrap';
        elAtual.style.overflowWrap = 'break-word';
        elAtual.style.wordBreak = 'normal';
        elProximo.style.whiteSpace = 'pre-wrap';
        elProximo.style.overflowWrap = 'break-word';
        elProximo.style.wordBreak = 'normal';
      }
      const projecaoAtiva = payloadMinistranteTemConteudoAtivo(ultimoPayloadMinistrante);
      aplicarFundoMinistrantePorProjecao(projecaoAtiva);
      const ehBibliaCfg =
        ultimoPayloadMinistrante && String(ultimoPayloadMinistrante.modo || '') === 'biblia';
      if (ehBibliaCfg && mon.fontFamily) {
        elAtual.style.fontFamily = mon.fontFamily;
        elProximo.style.fontFamily = mon.fontFamily;
        if (elRefBiblicaOp) elRefBiblicaOp.style.fontFamily = mon.fontFamily;
      }
      aplicarPosicaoConteudoMinistrante(mon, ehBibliaCfg);
      ajustarAutoFitSlidesMinistrante();
      /* A config mudou algo visível: invalida a assinatura para o re-render a seguir não ser
         apanhado pela dedup de payload — é o mesmo payload, mas com estilo novo. */
      assinaturaRenderMinistranteAplicada = null;
      if (ultimoPayloadMinistrante) aplicar(ultimoPayloadMinistrante);
    }

    function temTextoSlideMinistrante(texto) {
      return String(texto || '').trim().length > 0;
    }

    function elementoFlexVisivelOp(el) {
      return !!(el && !el.classList.contains('oculta'));
    }

    function pxGapWrapOp() {
      if (!elWrapLetras) return 0;
      const cs = getComputedStyle(elWrapLetras);
      const row = parseFloat(cs.rowGap);
      if (Number.isFinite(row)) return row;
      const g = parseFloat(cs.gap);
      return Number.isFinite(g) ? g : 0;
    }

    function alturaBlocoTituloOpPx() {
      if (!elementoFlexVisivelOp(elTituloMusicaOp)) return 0;
      const h = elTituloMusicaOp.getBoundingClientRect().height;
      const mb = parseFloat(getComputedStyle(elTituloMusicaOp).marginBottom) || 0;
      return h + mb;
    }

    function alturaRefOpPx() {
      if (!elementoFlexVisivelOp(elRefBiblicaOp)) return 0;
      return elRefBiblicaOp.getBoundingClientRect().height;
    }

    function fonteVhDoSlideOp(el, fallback) {
      const v = parseFloat(el && el.style.fontSize);
      return Number.isFinite(v) && v > 0 ? v : fallback;
    }

    function paddingHorizontalPx(el) {
      if (!el) return 0;
      const cs = getComputedStyle(el);
      return (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    }

    /** Largura da caixa de conteúdo do slide (sem padding), nesta janela. */
    function larguraConteudoSlideOp(el) {
      if (el && el.clientWidth > 12) {
        return Math.max(8, el.clientWidth - paddingHorizontalPx(el));
      }
      if (elWrapLetras && elWrapLetras.clientWidth > 12) {
        return Math.max(8, elWrapLetras.clientWidth - paddingHorizontalPx(elWrapLetras));
      }
      return (window.visualViewport && window.visualViewport.width) || window.innerWidth;
    }

    function slideCabeNaCaixaOp(el, maxW, maxH) {
      if (!el) return true;
      /* Comparar com a caixa DO SLIDE. O clientWidth do wrap inclui padding e
         fazia o fit achar que cabia quando o texto já encostava na borda.
         A tinta do glifo (side bearing do “O”) não aumenta o scrollWidth —
         isso resolve-se no CSS (padding / overflow), não a encolher a fonte. */
      const w = Math.min(maxW, el.clientWidth > 8 ? el.clientWidth : maxW);
      return el.scrollWidth <= w + 1 && el.scrollHeight <= maxH + 1;
    }

    /**
     * Encolhe UM painel até a linha mais larga caber na largura útil (comportamento
     * antigo, só quando o auto-fit de linhas longas está ligado ou o wrap está off).
     */
    function ajustarLarguraLinhasPainelOp(el, base, texto, mon, ehBiblia, usarMaiusculas, limite) {
      const linhas = [];
      String(textoPlanoMinistranteParaMedicao(texto) || '')
        .split(/\r\n|\r|\n/)
        .forEach((l) => linhas.push(l));
      if (!linhas.length) return;
      const medidor = document.createElement('span');
      medidor.style.position = 'fixed';
      medidor.style.left = '-99999px';
      medidor.style.top = '-99999px';
      medidor.style.visibility = 'hidden';
      medidor.style.whiteSpace = 'pre';
      medidor.style.fontFamily = getComputedStyle(el).fontFamily;
      medidor.style.fontWeight = ehBiblia
        ? mon.negrito !== false
          ? 'bold'
          : 'normal'
        : getComputedStyle(el).fontWeight;
      medidor.style.letterSpacing = getComputedStyle(el).letterSpacing;
      medidor.style.textTransform = usarMaiusculas ? 'uppercase' : 'none';
      document.body.appendChild(medidor);
      let atual = base;
      const minimo = 2.1;
      while (atual > minimo) {
        medidor.style.fontSize = `${atual}vh`;
        let maior = 0;
        for (const l of linhas) {
          const amostra = l || ' ';
          medidor.textContent = usarMaiusculas ? amostra.toUpperCase() : amostra;
          maior = Math.max(maior, medidor.getBoundingClientRect().width);
        }
        if (maior <= limite) break;
        atual -= 0.2;
      }
      document.body.removeChild(medidor);
      el.style.fontSize = `${Math.max(minimo, atual)}vh`;
    }

    function ajustarFonteSlideACaixaOp(el, fonteMaxVh, maxW, maxH) {
      if (!el || !slideFit || maxH < 8 || maxW < 8) return fonteMaxVh;
      const vh = slideFit.encolherFonteAteCaber({
        fonteMaxVh,
        fonteMinVh: slideFit.FONTE_MIN_VH,
        cabe(v) {
          el.style.fontSize = `${v}vh`;
          return slideCabeNaCaixaOp(el, maxW, maxH);
        },
      });
      el.style.fontSize = `${vh}vh`;
      return vh;
    }

    /**
     * Fonte por slide: o valor dos Ajustes é o teto. Slides curtos ficam nesse tamanho;
     * slides densos encolhem só o necessário para caber na área real do wrap (altura e
     * largura medidas no ecrã — AOC 32" ou Samsung 42").
     */
    function ajustarAutoFitSlidesMinistrante() {
      const mon = displayConfig.ministrante || {};
      const ehBiblia =
        ultimoPayloadMinistrante && String(ultimoPayloadMinistrante.modo || '') === 'biblia';
      const baseAtual = Math.max(2.2, Number(mon.fontSizeAtual ?? mon.fontSize ?? 4.1));
      const baseProximo = Math.max(2.2, Number(mon.fontSizeProximo ?? mon.fontSize ?? 4.1));
      elAtual.style.fontSize = `${baseAtual}vh`;
      elProximo.style.fontSize = `${baseProximo}vh`;
      const wrapLinhas = mon.wrapLongLines !== false;
      const autoFitLargura = wrapLinhas ? mon.autoFitLongLines === true : true;
      const usarMaiusculas = ehBiblia ? mon.maiusculo === true : true;
      const plMed = ultimoPayloadMinistrante || {};

      if (autoFitLargura) {
        /* Largura da caixa de texto DESTA janela, não o wrap com padding. */
        const limiteAtual = larguraConteudoSlideOp(elAtual);
        const limiteProximo = larguraConteudoSlideOp(elProximo);
        if (Number.isFinite(limiteAtual) && limiteAtual > 0) {
          ajustarLarguraLinhasPainelOp(
            elAtual, baseAtual, plMed.atual, mon, ehBiblia, usarMaiusculas, limiteAtual
          );
        }
        if (Number.isFinite(limiteProximo) && limiteProximo > 0) {
          ajustarLarguraLinhasPainelOp(
            elProximo, baseProximo, plMed.proximo, mon, ehBiblia, usarMaiusculas, limiteProximo
          );
        }
      }

      aplicarRespiroTituloAberturaOp();

      if (!slideFit || !elWrapLetras) return;

      const areaH = elWrapLetras.clientHeight;
      const areaW = elWrapLetras.clientWidth;
      if (!Number.isFinite(areaH) || areaH < 40 || !Number.isFinite(areaW) || areaW < 40) return;

      const atualOn = temTextoSlideMinistrante(plMed.atual);
      const proxOn = temTextoSlideMinistrante(plMed.proximo);
      const nFlex = [elTituloMusicaOp, elAtual, elRefBiblicaOp, elProximo]
        .filter(elementoFlexVisivelOp).length;
      const gapsPx = Math.max(0, nFlex - 1) * pxGapWrapOp();
      const margem = slideFit.MARGEM_PX || 2;

      const encaixarNaAltura = () => {
        const restante = Math.max(
          0,
          areaH - alturaBlocoTituloOpPx() - alturaRefOpPx() - gapsPx - margem
        );
        const hA = atualOn ? elAtual.scrollHeight : 0;
        const hP = proxOn ? elProximo.scrollHeight : 0;
        const orc = slideFit.calcularOrcamentosSlides({
          restantePx: restante,
          alturaAtualPx: hA,
          alturaProximoPx: hP,
          atualTemConteudo: atualOn,
          proximoTemConteudo: proxOn,
        });
        if (atualOn && !slideCabeNaCaixaOp(elAtual, areaW, Math.max(8, orc.budgetAtualPx))) {
          ajustarFonteSlideACaixaOp(
            elAtual,
            fonteVhDoSlideOp(elAtual, baseAtual),
            areaW,
            Math.max(8, orc.budgetAtualPx)
          );
        }
        if (proxOn && !slideCabeNaCaixaOp(elProximo, areaW, Math.max(8, orc.budgetProximoPx))) {
          ajustarFonteSlideACaixaOp(
            elProximo,
            fonteVhDoSlideOp(elProximo, baseProximo),
            areaW,
            Math.max(8, orc.budgetProximoPx)
          );
        }
      };

      encaixarNaAltura();
      /* O respiro mede-se na fonte efectiva; depois de encolher, a margem do título
         diminui e pode libertar altura — uma segunda passagem aproveita isso sem
         voltar a crescer acima do teto já aplicado. */
      aplicarRespiroTituloAberturaOp();
      encaixarNaAltura();
      aplicarRespiroTituloAberturaOp();
    }

    function limparCapasApresentacaoOuAviso() {
      elCapaAp.hidden = true;
      elCapaAp.innerHTML = '';
      elCapaAviso.hidden = true;
      elCapaAvisoTexto.textContent = '';
      limparContagemMinistrante();
      if (elWrapLetras) elWrapLetras.style.visibility = '';
    }

    function aplicarSyncVideoApresentacaoNoHost(host, st) {
      if (!host || host.hidden) return;
      const video = host.querySelector('video.lyra-ap-video-proj');
      if (!video || !video.src) return;
      const payload = st && typeof st === 'object' ? st : {};
      const vol = Number(payload.volume);
      if (Number.isFinite(vol)) {
        video.volume = Math.max(0, Math.min(1, vol));
      }
      if (payload.syncTime === true) {
        const t = Number(payload.currentTime);
        if (Number.isFinite(t)) {
          try {
            video.currentTime = Math.max(0, t);
          } catch (_) {}
        }
      }
      const playing = !!payload.playing;
      if (playing && video.paused) {
        const p = video.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } else if (!playing && !video.paused) {
        video.pause();
      }
    }

    function renderizarMidiaApresentacaoNoHost(host, ap) {
      if (!host) return;
      const videoAntigo = host.querySelector('video.lyra-ap-video-proj');
      if (videoAntigo) {
        try {
          videoAntigo.pause();
        } catch (_) {}
      }
      host.innerHTML = '';
      const p = ap || {};
      const kind = String(p.kind || 'iframe').toLowerCase();
      const src = String(p.src || '').trim();
      if (!src) {
        const msg = document.createElement('div');
        msg.style.cssText = 'color:#fff;font-size:2vh;text-align:center;padding:4vh;';
        msg.textContent = 'Sem mídia.';
        host.appendChild(msg);
        return;
      }
      if (kind === 'image') {
        const img = document.createElement('img');
        img.src = src;
        img.alt = p.title ? String(p.title) : '';
        host.appendChild(img);
        return;
      }
      if (kind === 'video') {
        const video = document.createElement('video');
        video.className = 'lyra-ap-video-proj';
        video.src = src;
        video.autoplay = false;
        video.loop = false;
        video.muted = true;
        video.controls = false;
        video.playsInline = true;
        video.preload = 'auto';
        host.appendChild(video);
        return;
      }
      const iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.allow = 'autoplay; fullscreen';
      iframe.referrerPolicy = 'no-referrer';
      iframe.setAttribute('allowfullscreen', 'true');
      host.appendChild(iframe);
    }

    const BIBLIA_FADE_MS = 150;
    let bibliaMinFadeTimer = null;
    let bibliaMinUltimoTexto = '';

    function atualizarTextoBibliaMinistranteComFade(atualTxt, tituloRef, modoPayload, continuar) {
      const chave = `${atualTxt}\n${tituloRef}`;
      if (modoPayload !== 'biblia' || !bibliaMinUltimoTexto || chave === bibliaMinUltimoTexto) {
        bibliaMinUltimoTexto = chave;
        continuar();
        return;
      }
      clearTimeout(bibliaMinFadeTimer);
      const alvos = [elAtual, elRefBiblicaOp].filter(Boolean);
      const reduzido = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!alvos.length || reduzido) {
        bibliaMinUltimoTexto = chave;
        continuar();
        return;
      }
      alvos.forEach((el) => {
        el.style.opacity = '0';
      });
      bibliaMinFadeTimer = setTimeout(() => {
        bibliaMinUltimoTexto = chave;
        continuar();
        requestAnimationFrame(() => {
          alvos.forEach((el) => {
            el.style.opacity = '1';
          });
        });
      }, BIBLIA_FADE_MS);
    }

    const RX_LINHA_COMENTARIO_MIN = /^\s*\/\/(.*)$/;

    function isLinhaComentarioMinistrante(linha) {
      return RX_LINHA_COMENTARIO_MIN.test(String(linha ?? ''));
    }

    function textoExibicaoComentarioMinistrante(linha) {
      const m = String(linha ?? '').match(RX_LINHA_COMENTARIO_MIN);
      if (!m) return String(linha ?? '');
      return String(m[1] ?? '').trimStart();
    }

    function escapeHtmlMinistrante(s) {
      return String(s ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    const COR_COMENTARIO_MIN_PADRAO = '#00c8ff';

    /**
     * Hex seguro para comentários.
     *
     * Uma custom property com valor inválido não activa o fallback do `var()`: a declaração
     * `color` fica inválida no tempo de computação e a linha HERDA a cor do pai — o branco
     * de `#atual`. Era assim que o comentário «virava branco sozinho». Só sai daqui hex
     * válido, e um valor ausente/inválido devolve `fallback` (a cor já aplicada), nunca o
     * padrão de fábrica.
     */
    function normalizarCorComentarioMinistrante(cor, fallback = COR_COMENTARIO_MIN_PADRAO) {
      const c = String(cor ?? '').trim();
      if (/^#[0-9a-fA-F]{3}([0-9a-fA-F]{3})?$/.test(c)) return c;
      if (/^#[0-9a-fA-F]{4}$/.test(c) || /^#[0-9a-fA-F]{8}$/.test(c)) return c;
      const fb = String(fallback ?? '').trim();
      if (/^#[0-9a-fA-F]{3,8}$/.test(fb)) return fb;
      return COR_COMENTARIO_MIN_PADRAO;
    }

    /**
     * Fonte ÚNICA da cor do comentário: entra no `style` inline de cada linha `//`.
     *
     * Não há custom property CSS a duplicar isto — ver a nota na folha de estilo. Uma
     * segunda fonte que possa divergir (ou ficar inválida) é precisamente o que produzia o
     * frame com a cor do contentor.
     */
    let corComentarioMinistranteAplicada = COR_COMENTARIO_MIN_PADRAO;

    function definirCorComentarioMinistrante(cor) {
      corComentarioMinistranteAplicada = normalizarCorComentarioMinistrante(
        cor,
        corComentarioMinistranteAplicada
      );
      return corComentarioMinistranteAplicada;
    }

    function corComentarioMinistranteAtual() {
      return corComentarioMinistranteAplicada;
    }

    function htmlTextoMinistranteComComentarios(texto, maiusculo) {
      const mai = maiusculo || ((s) => s);
      const corComentario = corComentarioMinistranteAtual();
      const lines = String(texto ?? '').split(/\r\n|\r|\n/);
      return lines
        .map((line) => {
          if (line === '') {
            return '<span class="linha-ministrante linha-ministrante--vazia">\u00a0</span>';
          }
          if (isLinhaComentarioMinistrante(line)) {
            const inner = mai(textoExibicaoComentarioMinistrante(line));
            /* `!important` inline: nenhuma regra de folha de estilo, presente ou futura,
               pode passar à frente da cor escolhida pelo utilizador. */
            return `<span class="linha-ministrante linha-ministrante-comentario" style="color:${corComentario} !important">${escapeHtmlMinistrante(inner)}</span>`;
          }
          const inner = mai(line);
          return `<span class="linha-ministrante">${escapeHtmlMinistrante(inner)}</span>`;
        })
        .join('');
    }

    function textoPlanoMinistranteParaMedicao(texto) {
      return String(texto ?? '')
        .split(/\r\n|\r|\n/)
        .map((line) => {
          if (isLinhaComentarioMinistrante(line)) return textoExibicaoComentarioMinistrante(line);
          return line;
        })
        .join('\n');
    }

    /**
     * Escreve o HTML só quando ele MUDOU. Reescrever `innerHTML` idêntico destrói e recria
     * os `<span>` — um frame sem os nós, logo um repaint. Como o comentário é o único
     * elemento com cor própria, era ele que aparecia a piscar.
     */
    function aplicarHtmlMinistrante(el, texto, maiusculo) {
      if (!el) return;
      const raw = String(texto ?? '');
      const html = raw.trim() ? htmlTextoMinistranteComComentarios(raw, maiusculo) : '';
      if (el.__lyraHtmlMinistrante === html && (html === '' || el.childElementCount > 0)) return;
      el.__lyraHtmlMinistrante = html;
      el.innerHTML = html;
    }

    /** Limpeza que mantém o cache de `aplicarHtmlMinistrante` coerente com o DOM. */
    function limparHtmlMinistrante(el) {
      if (!el) return;
      el.__lyraHtmlMinistrante = '';
      el.textContent = '';
    }

    /**
     * Assinatura do último payload REALMENTE desenhado.
     *
     * `render({ reforcarMinistrante: true })` — o caminho de toda troca de estrofe — envia o
     * MESMO payload três vezes: imediato, `setImmediate` e `setTimeout(160)`. É um
     * *workaround* de timing (a janela perdia a primeira atualização em alguns casos) e
     * continua intacto: o reenvio acontece na mesma. O que muda é o lado de cá — quando o
     * payload é idêntico ao que já está no ecrã, não se redesenha.
     *
     * Sem esta guarda cada estrofe fazia três reconstruções completas do `innerHTML` e três
     * passagens de `ajustarAutoFitSlidesMinistrante` (que repõe a fonte na base e volta a
     * encolher por medição) em frames separados — a terceira 160 ms depois. O comentário,
     * único elemento com cor e itálico próprios, era destruído e recriado a cada uma: é
     * exactamente a piscada vista no M3.
     *
     * A dedup é local ao renderer, logo só pode saltar o que ELE já desenhou — se a
     * primeira mensagem se perder, a assinatura guardada continua a ser a antiga e o
     * reforço desenha normalmente. O workaround mantém-se funcional.
     */
    let assinaturaRenderMinistranteAplicada = null;

    function assinaturaRenderMinistrante(payload) {
      try {
        return JSON.stringify(payload ?? null);
      } catch (_) {
        return null;
      }
    }

    function aplicar(payload) {
      const modo = String(payload?.modo || 'texto');
      /* Apresentação e aviso ficam de fora: recriam `<video>`/`<iframe>` e o seu ciclo de
         vida não é assunto desta correcção. Só o caminho de letra/Bíblia é deduplicado. */
      const podeDeduplicar = modo !== 'apresentacao' && modo !== 'aviso' && modo !== 'contagem';
      const assinatura = podeDeduplicar ? assinaturaRenderMinistrante(payload) : null;
      const repetido = assinatura !== null && assinatura === assinaturaRenderMinistranteAplicada;
      ultimoPayloadMinistrante = payload || null;
      if (repetido) return;
      assinaturaRenderMinistranteAplicada = assinatura;
      const slidePreto = !!(payload && (payload.slidePretoFinal || payload.blackout));

      /* Slide preto (= slide sem letra) ou blackout: fundo preto puro nos dois monitores. */
      if (slidePreto) {
        limparCapasApresentacaoOuAviso();
        if (elWrapLetras) elWrapLetras.style.visibility = 'visible';
        limparHtmlMinistrante(elAtual);
        limparHtmlMinistrante(elProximo);
        aplicarReferenciaBiblicaMinistrante('', 'texto');
        aplicarTituloMusicaAbertura({ modo: 'texto' });
        elAtual.classList.add('vazio');
        elProximo.classList.add('vazio');
        const wrapPreto = document.querySelector('.wrap');
        if (wrapPreto) wrapPreto.style.background = 'transparent';
        document.body.classList.add('slide-preto-final');
        document.body.style.background = '#000000';
        return;
      }
      document.body.classList.remove('slide-preto-final');

      const vazio = !payloadMinistranteTemConteudoAtivo(payload);

      if (vazio) {
        limparCapasApresentacaoOuAviso();
        if (elWrapLetras) elWrapLetras.style.visibility = 'visible';
        limparHtmlMinistrante(elAtual);
        limparHtmlMinistrante(elProximo);
        aplicarReferenciaBiblicaMinistrante('', 'texto');
        aplicarTituloMusicaAbertura({ modo: 'texto' });
        elAtual.classList.add('vazio');
        elProximo.classList.add('vazio');
        const wrapOcioso = document.querySelector('.wrap');
        if (wrapOcioso) wrapOcioso.style.background = '';
        aplicarFundoMinistrantePorProjecao(false);
        return;
      }

      aplicarFundoMinistrantePorProjecao(true);
      if (elWrapLetras) elWrapLetras.style.background = '';

      if (modo === 'apresentacao') {
        limparCapasApresentacaoOuAviso();
        elCapaAviso.hidden = true;
        aplicarTituloMusicaAbertura({ modo: 'texto' });
        renderizarMidiaApresentacaoNoHost(elCapaAp, payload.apresentacao);
        elCapaAp.hidden = false;
        if (elWrapLetras) elWrapLetras.style.visibility = 'hidden';
        return;
      }

      if (modo === 'contagem') {
        limparCapasApresentacaoOuAviso();
        elCapaAp.hidden = true;
        elCapaAviso.hidden = true;
        aplicarTituloMusicaAbertura({ modo: 'texto' });
        if (contagemRender) contagemRender.mostrar(payload.contagem);
        if (elWrapLetras) elWrapLetras.style.visibility = 'hidden';
        return;
      }

      if (modo === 'aviso') {
        limparCapasApresentacaoOuAviso();
        elCapaAp.hidden = true;
        aplicarTituloMusicaAbertura({ modo: 'texto' });
        aplicarEstiloAvisoMinistrante(payload.avisoConfig);
        const linhas = Array.isArray(payload.linhas) ? payload.linhas : [];
        elCapaAvisoTexto.textContent = linhas.join('\n');
        elCapaAviso.hidden = false;
        if (elWrapLetras) elWrapLetras.style.visibility = 'hidden';
        return;
      }

      limparCapasApresentacaoOuAviso();
      const atualTxt = String(payload.atual || '');
      const proxTxt = String(payload.proximo || '');
      const tituloRef = normalizarReferenciaBiblicaMinistrante(payload.titulo);
      const modoPayload = String(payload.modo || 'texto');
      const ehBiblia = modoPayload === 'biblia';

      const aplicarLinhasMinistrante = () => {
        const mai = ehBiblia ? (s) => s : (s) => String(s || '').toUpperCase();
        aplicarHtmlMinistrante(elAtual, atualTxt, mai);
        aplicarHtmlMinistrante(elProximo, proxTxt, mai);
        aplicarReferenciaBiblicaMinistrante(tituloRef, modoPayload);
        aplicarTituloMusicaAbertura(payload);
      };

      if (ehBiblia) {
        atualizarTextoBibliaMinistranteComFade(atualTxt, tituloRef, modoPayload, aplicarLinhasMinistrante);
      } else {
        bibliaMinUltimoTexto = '';
        aplicarLinhasMinistrante();
      }

      if (ehBiblia) {
        const mon = displayConfig.ministrante || {};
        const usarMaiusculas = mon.maiusculo === true;
        const usarNegrito = mon.negrito !== false;
        const wrap = mon.wrapLongLines !== false;
        elAtual.style.textTransform = usarMaiusculas ? 'uppercase' : 'none';
        elProximo.style.textTransform = usarMaiusculas ? 'uppercase' : 'none';
        elAtual.style.fontWeight = usarNegrito ? 'bold' : 'normal';
        elProximo.style.fontWeight = usarNegrito ? 'bold' : 'normal';
        if (!wrap) {
          elAtual.style.whiteSpace = 'pre';
          elAtual.style.overflowWrap = 'normal';
          elAtual.style.wordBreak = 'normal';
          elProximo.style.whiteSpace = 'pre';
          elProximo.style.overflowWrap = 'normal';
          elProximo.style.wordBreak = 'normal';
        } else {
          elAtual.style.whiteSpace = 'pre-wrap';
          elAtual.style.overflowWrap = 'break-word';
          elAtual.style.wordBreak = 'normal';
          elProximo.style.whiteSpace = 'pre-wrap';
          elProximo.style.overflowWrap = 'break-word';
          elProximo.style.wordBreak = 'normal';
        }
        if (mon.fontFamily) {
          elAtual.style.fontFamily = mon.fontFamily;
          elProximo.style.fontFamily = mon.fontFamily;
          if (elRefBiblicaOp) elRefBiblicaOp.style.fontFamily = mon.fontFamily;
        }
        aplicarPosicaoConteudoMinistrante(mon, true);
      } else {
        elAtual.style.textTransform = 'uppercase';
        elProximo.style.textTransform = 'uppercase';
        aplicarPosicaoConteudoMinistrante({}, false);
      }
      elAtual.classList.toggle('vazio', !payload.atual);
      elProximo.classList.toggle('vazio', !payload.proximo);
      ajustarAutoFitSlidesMinistrante();
    }

    ipcRenderer.on('atualizar_ministrante', (_, payload) => aplicar(payload || {}));
    ipcRenderer.on('display_config', (_, cfg) => aplicarConfig(cfg));
    ipcRenderer.on('apresentacao_video_sync', (_, payload) => {
      aplicarSyncVideoApresentacaoNoHost(elCapaAp, payload || {});
    });
    let timerRefitOp = null;
    function reportarViewportMinistrante() {
      if (!viewportDaJanela) return;
      viewportDaJanela.reportarViewportJanela('ministrante', { elArea: elWrapLetras });
    }
    window.addEventListener('resize', () => {
      clearTimeout(timerRefitOp);
      timerRefitOp = setTimeout(() => {
        ajustarAutoFitSlidesMinistrante();
        reportarViewportMinistrante();
      }, 50);
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        ajustarAutoFitSlidesMinistrante();
        reportarViewportMinistrante();
      }).catch(() => {});
    }
    reportarViewportMinistrante();
    aplicar({ telaLimpa: true });
  </script>
</body>
</html>
