<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Lyra — Relógio</title>
  <style>
    @font-face {
      font-family: 'CMG Sans';
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: local('CMG Sans'), local('CMGSans-Regular'), url('./fonts/CMGSans-Regular.woff2') format('woff2');
    }
    @font-face {
      font-family: 'CMG Sans';
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: local('CMG Sans Bold'), local('CMGSans-Bold'), url('./fonts/CMGSans-Bold.woff2') format('woff2');
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      cursor: none;
      font-family: 'CMG Sans', 'DM Sans', system-ui, -apple-system, sans-serif;
      padding: 3vh 4vw;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.6vh;
      width: 100%;
      max-width: 100%;
      min-width: 0;
      height: 100%;
      text-align: center;
      overflow: hidden;
      box-sizing: border-box;
    }
    .clock {
      font-size: 13vh;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    .meta {
      max-width: 92%;
      line-height: 1.35;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      opacity: 0.86;
    }
    #clock-date {
      flex-shrink: 0;
    }
    #clock-analog-wrap {
      flex-shrink: 0;
    }
    /*
     * Só o versículo: `align-self:stretch` impede o flex (`align-items:center`)
     * de alargar a caixa até à linha inteira. Sem isso, clientWidth == scrollWidth
     * e o `.wrap { overflow:hidden }` corta as pontas.
     */
    #clock-verse {
      flex-shrink: 0;
      align-self: stretch;
      width: auto;
      max-width: 100%;
      min-width: 0;
      box-sizing: border-box;
      padding-inline: 4%;
      overflow-wrap: break-word;
      word-break: normal;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="clock-digital" class="clock"></div>
    <div id="clock-analog-wrap" style="display:none;line-height:0">
      <canvas id="clock-canvas" width="320" height="320"></canvas>
    </div>
    <div id="clock-date" class="meta"></div>
    <div id="clock-verse" class="meta"></div>
  </div>
  <script>
    const { ipcRenderer, webFrame } = require('electron');
    try {
      if (webFrame && typeof webFrame.setZoomFactor === 'function') webFrame.setZoomFactor(1);
    } catch (_) {}
    let viewportDaJanela = null;
    try {
      viewportDaJanela = require('./js/viewportDaJanela');
    } catch (e) {
      console.error('[Lyra] viewportDaJanela indisponível no relógio:', e && e.message);
    }
    let layoutDiagnostico = null;
    try {
      layoutDiagnostico = require('./js/layoutDiagnostico');
    } catch (e) {
      console.error('[Lyra] layoutDiagnostico indisponível no relógio:', e && e.message);
    }

    const elClockDigital = document.getElementById('clock-digital');
    const elClockAnalogWrap = document.getElementById('clock-analog-wrap');
    const elClockCanvas = document.getElementById('clock-canvas');
    const elClockDate = document.getElementById('clock-date');
    const elClockVerse = document.getElementById('clock-verse');

    let timer = null;
    let displayConfig = {
      clock: {
        format: 'HH:MM',
        fontSize: 13,
        dateFontSize: 2.4,
        verseFontSize: 2.4,
        showDate: true,
        showVerse: false,
        verse: '',
        bgType: 'solid',
        /* Preto/branco de propósito, e NÃO o padrão creme do `DEFAULT_DISPLAY_CONFIG`:
           isto é só a rede de segurança para o caso de o bootstrap abaixo falhar. Casar
           com o `backgroundColor` nativo da janela faz esse caminho não piscar. */
        bgColor: '#000000',
        bgGradient: 'linear-gradient(135deg, #1a1816 0%, #2c2420 100%)',
        bgImage: '',
        textColor: '#ffffff',
        dateColor: '#ffffff',
        verseColor: '#ffffff',
      },
    };

    /**
     * Config real entregue na linha de comando pelo motor (`bootstrapArgvRelogio`).
     *
     * Corre ANTES do primeiro `aplicarConfig`, para a janela pintar já com o fundo e a cor
     * do utilizador. Antes disto a página abria com o seu próprio tema e corrigia-se quando
     * o `display_config` chegava por IPC — um flash a cada recriação da janela do relógio.
     */
    function lerConfigDoArranque() {
      try {
        const prefixo = '--lyra-clock-cfg=';
        const arg = (process.argv || []).find((a) => String(a).startsWith(prefixo));
        if (!arg) return null;
        const bruto = JSON.parse(decodeURIComponent(arg.slice(prefixo.length)));
        return bruto && typeof bruto === 'object' ? bruto : null;
      } catch (_) {
        return null;
      }
    }

    function corRelogio(clk) {
      return clk.textColor || '#1c1816';
    }

    function corData(clk) {
      return clk.dateColor || clk.textColor || '#1c1816';
    }

    function corVersiculo(clk) {
      return clk.verseColor || clk.textColor || '#1c1816';
    }

    function aplicarFundoRelogio(clk) {
      if (clk.bgType === 'gradient') {
        document.body.style.background = clk.bgGradient || '#000000';
      } else if (clk.bgType === 'image' && clk.bgImage) {
        document.body.style.background = `url('${clk.bgImage}') center/cover no-repeat`;
      } else {
        document.body.style.background = clk.bgColor || '#000000';
      }
    }

    function desenharRelogioAnalogico(now, cor) {
      if (!elClockCanvas) return;
      const ctxCv = elClockCanvas.getContext('2d');
      const W = elClockCanvas.width;
      const H = elClockCanvas.height;
      const cx = W / 2;
      const cy = H / 2;
      const r = W / 2 - 14;

      ctxCv.clearRect(0, 0, W, H);

      ctxCv.beginPath();
      ctxCv.arc(cx, cy, r, 0, 2 * Math.PI);
      ctxCv.strokeStyle = cor;
      ctxCv.globalAlpha = 0.28;
      ctxCv.lineWidth = 2;
      ctxCv.stroke();
      ctxCv.globalAlpha = 1;

      for (let i = 0; i < 12; i++) {
        const ang = (i / 12) * 2 * Math.PI - Math.PI / 2;
        const maior = i % 3 === 0;
        const inner = maior ? r - 22 : r - 10;
        ctxCv.beginPath();
        ctxCv.moveTo(cx + Math.cos(ang) * inner, cy + Math.sin(ang) * inner);
        ctxCv.lineTo(cx + Math.cos(ang) * r, cy + Math.sin(ang) * r);
        ctxCv.strokeStyle = cor;
        ctxCv.globalAlpha = maior ? 0.85 : 0.38;
        ctxCv.lineWidth = maior ? 3 : 1.5;
        ctxCv.stroke();
        ctxCv.globalAlpha = 1;
      }

      const sec = now.getSeconds();
      const min = now.getMinutes() + sec / 60;
      const hr = (now.getHours() % 12) + min / 60;

      const desenharMao = (frac, len, largura, alpha) => {
        const ang = frac * 2 * Math.PI - Math.PI / 2;
        ctxCv.beginPath();
        ctxCv.moveTo(cx, cy);
        ctxCv.lineTo(cx + Math.cos(ang) * len, cy + Math.sin(ang) * len);
        ctxCv.strokeStyle = cor;
        ctxCv.globalAlpha = alpha;
        ctxCv.lineWidth = largura;
        ctxCv.lineCap = 'round';
        ctxCv.stroke();
        ctxCv.globalAlpha = 1;
      };

      desenharMao(hr / 12, r * 0.52, 9, 0.95);
      desenharMao(min / 60, r * 0.73, 5.5, 0.88);
      desenharMao(sec / 60, r * 0.82, 2, 0.65);

      ctxCv.beginPath();
      ctxCv.arc(cx, cy, 7, 0, 2 * Math.PI);
      ctxCv.fillStyle = cor;
      ctxCv.globalAlpha = 0.9;
      ctxCv.fill();
      ctxCv.globalAlpha = 1;
    }

    function aplicarConfig(cfg) {
      if (!cfg || typeof cfg !== 'object') return;
      displayConfig = {
        ...displayConfig,
        clock: { ...(displayConfig.clock || {}), ...(cfg.clock || {}) },
      };
      const clk = displayConfig.clock || {};

      elClockDigital.style.color = corRelogio(clk);
      elClockDate.style.color = corData(clk);
      elClockVerse.style.color = corVersiculo(clk);

      elClockDigital.style.fontSize = `${Math.max(7, Number(clk.fontSize || 13))}vh`;
      elClockDate.style.fontSize = `${Math.max(0.8, Number(clk.dateFontSize || 2.4))}vh`;
      elClockVerse.style.fontSize = `${Math.max(0.8, Number(clk.verseFontSize || 2.4))}vh`;

      aplicarFundoRelogio(clk);
      tick();
      ajustarVersiculoRelogioAoEspaco();
      if (!timer) timer = setInterval(tick, 1000);
    }

    function elementoRelogioVisivel(el) {
      if (!el) return false;
      try {
        if (getComputedStyle(el).display === 'none') return false;
      } catch (_) {
        if (el.style.display === 'none') return false;
      }
      return true;
    }

    function pxGapWrapRelogio() {
      const wrap = elClockVerse && elClockVerse.parentElement;
      if (!wrap) return 0;
      const cs = getComputedStyle(wrap);
      const row = parseFloat(cs.rowGap);
      if (Number.isFinite(row)) return row;
      const g = parseFloat(cs.gap);
      return Number.isFinite(g) ? g : 0;
    }

    function quebraLinhaAtivaRelogio(el) {
      if (!el) return false;
      try {
        const ws = getComputedStyle(el).whiteSpace;
        return ws === 'pre-wrap' || ws === 'pre-line' || ws === 'break-spaces' || ws === 'normal';
      } catch (_) {
        return true;
      }
    }

    function fonteVhRelogio(el, fallback) {
      const v = parseFloat(el && el.style.fontSize);
      return Number.isFinite(v) && v > 0 ? v : fallback;
    }

    function medirCabimentoVersiculoRelogio(el, maxH) {
      if (!el) {
        return {
          larguraDisponivel: 0,
          larguraTexto: 0,
          alturaDisponivel: 0,
          alturaTexto: 0,
          textoCabeHorizontalmente: true,
          textoCabeVerticalmente: true,
        };
      }
      void el.offsetWidth;
      const wrap = el.parentElement;
      const wrapW = wrap && wrap.clientWidth > 8 ? wrap.clientWidth : 0;
      const elW = el.clientWidth;
      /*
       * Se o flex inflar o versículo, clientWidth acompanha o texto e o overflow
       * horizontal «desaparece». A largura real é a do contentor `.wrap`.
       */
      const larguraDisponivel = wrapW > 8
        ? Math.min(elW > 8 ? elW : wrapW, wrapW)
        : elW;
      const larguraTexto = el.scrollWidth;
      const rectEl = el.getBoundingClientRect();
      const rectWrap = wrap ? wrap.getBoundingClientRect() : null;
      const inflouAlemDoWrap = !!(
        rectWrap &&
        Number.isFinite(rectWrap.width) &&
        rectEl.width > rectWrap.width + 1
      );
      const alturaDisponivel = Number.isFinite(maxH) ? maxH : el.clientHeight;
      const alturaTexto = el.scrollHeight;
      const cabeH = !inflouAlemDoWrap &&
        !(larguraDisponivel > 8 && larguraTexto > larguraDisponivel + 1);
      const cabeV = !(alturaDisponivel > 8 && alturaTexto > alturaDisponivel + 1);
      return {
        larguraDisponivel,
        larguraTexto,
        alturaDisponivel,
        alturaTexto,
        textoCabeHorizontalmente: cabeH,
        textoCabeVerticalmente: cabeV,
      };
    }

    function versiculoRelogioCabeNaCaixa(el, maxH) {
      const m = medirCabimentoVersiculoRelogio(el, maxH);
      return m.textoCabeHorizontalmente && m.textoCabeVerticalmente;
    }

    /**
     * Reduz a fonte do versículo até caber na caixa real do elemento.
     * Overflow horizontal e vertical; o fator mais restritivo ganha.
     * Versículo curto (já cabe) permanece no tamanho configurado.
     */
    function encolherFonteVersiculoRelogio(el, fonteMaxVh, maxH) {
      let vh = fonteMaxVh;
      el.style.fontSize = `${vh}vh`;
      if (versiculoRelogioCabeNaCaixa(el, maxH)) return vh;

      const pisoLoop = 0.15;
      for (let i = 0; i < 28; i++) {
        const m = medirCabimentoVersiculoRelogio(el, maxH);
        let factor = 1;
        if (!m.textoCabeHorizontalmente && m.larguraDisponivel > 8 && m.larguraTexto > 0) {
          factor = Math.min(factor, m.larguraDisponivel / m.larguraTexto);
        }
        if (!m.textoCabeVerticalmente && m.alturaDisponivel > 8 && m.alturaTexto > 0) {
          factor = Math.min(factor, m.alturaDisponivel / m.alturaTexto);
        }
        if (factor >= 0.999) break;
        vh = vh * factor * 0.992;
        if (vh < pisoLoop) vh = pisoLoop;
        el.style.fontSize = `${vh}vh`;
        if (versiculoRelogioCabeNaCaixa(el, maxH)) break;
        if (vh <= pisoLoop) break;
      }
      return fonteVhRelogio(el, vh);
    }

    function emitirDiagnosticoRelogio(opts) {
      if (!layoutDiagnostico) return;
      const {
        wrap,
        quebra,
        baseVh,
        motivo,
        areaH,
        areaW,
        maxH,
        payloadAntes,
        medicaoAntes,
      } = opts;
      const fonteFinalVh = fonteVhRelogio(elClockVerse, baseVh);
      const medicaoDepois = medirCabimentoVersiculoRelogio(elClockVerse, maxH);
      const payloadDepois = layoutDiagnostico.capturarPayloadLayout({
        momento: 'depois',
        elTexto: elClockVerse,
        elContainer: wrap,
        quebraLinhaAtiva: quebra,
        extra: {
          motivo,
          fonteInicialVh: baseVh,
          fonteFinalVh,
          areaH,
          areaW,
          maxH,
        },
      });
      const criterio = layoutDiagnostico.criterioQueLimitou(
        medicaoAntes.textoCabeHorizontalmente,
        medicaoAntes.textoCabeVerticalmente,
      );
      layoutDiagnostico.emitirBlocosComGeometriaNativa([
        { prefixo: '[relogio-layout-diagnostico]', payload: payloadAntes },
        { prefixo: '[relogio-layout-diagnostico]', payload: payloadDepois },
        {
          prefixo: '[layout-decisao]',
          payload: {
            contexto: 'relogio',
            quebraLinhaAtiva: quebra,
            larguraDisponivel: medicaoAntes.larguraDisponivel,
            larguraTexto: medicaoAntes.larguraTexto,
            alturaDisponivel: medicaoAntes.alturaDisponivel,
            alturaTexto: medicaoAntes.alturaTexto,
            fonteInicial: baseVh,
            fonteFinal: fonteFinalVh,
            textoCabeHorizontalmente: medicaoDepois.textoCabeHorizontalmente,
            textoCabeVerticalmente: medicaoDepois.textoCabeVerticalmente,
            houveReducaoDeFonte: fonteFinalVh + 0.001 < baseVh,
            criterioQueLimitou: criterio,
            motivo,
            textoCabeHorizontalmenteAntes: medicaoAntes.textoCabeHorizontalmente,
            textoCabeVerticalmenteAntes: medicaoAntes.textoCabeVerticalmente,
            larguraDisponivelDepois: medicaoDepois.larguraDisponivel,
            larguraTextoDepois: medicaoDepois.larguraTexto,
            alturaDisponivelDepois: medicaoDepois.alturaDisponivel,
            alturaTextoDepois: medicaoDepois.alturaTexto,
            overflowHorizontalDepois: !medicaoDepois.textoCabeHorizontalmente,
            overflowVerticalDepois: !medicaoDepois.textoCabeVerticalmente,
            algoritmoConsideraLargura: true,
            algoritmoConsideraAltura: true,
          },
        },
      ]);
    }

    /**
     * Aplica o `verseFontSize` dos Ajustes no bloco do versículo.
     * Encolhe só se esse bloco transbordar na largura ou na altura disponível
     * abaixo do relógio/data. Relógio e data não são medidos nem alterados.
     */
    function ajustarVersiculoRelogioAoEspaco() {
      const clk = displayConfig.clock || {};
      if (!elClockVerse || clk.showVerse === false || !clk.verse) return;
      const minVh = 0.8;
      const baseVh = Math.max(minVh, Number(clk.verseFontSize || 2.4));
      elClockVerse.style.fontSize = `${baseVh}vh`;

      const wrap = elClockVerse.parentElement;
      if (!wrap) return;
      const areaH = wrap.clientHeight;
      const areaW = wrap.clientWidth;
      const quebra = quebraLinhaAtivaRelogio(elClockVerse);
      const capturarAntes = (motivo, extraMaxH) => layoutDiagnostico
        ? layoutDiagnostico.capturarPayloadLayout({
            momento: 'antes',
            elTexto: elClockVerse,
            elContainer: wrap,
            quebraLinhaAtiva: quebra,
            extra: {
              motivo,
              fonteInicialVh: baseVh,
              areaH,
              areaW,
              maxH: extraMaxH,
            },
          })
        : null;

      /* Layout ainda não está estável: fica no tamanho pedido, não se inventa um mínimo. */
      if (!Number.isFinite(areaH) || areaH < 80 || !Number.isFinite(areaW) || areaW < 80) {
        const medicaoAntes = medirCabimentoVersiculoRelogio(elClockVerse, areaH);
        emitirDiagnosticoRelogio({
          wrap,
          quebra,
          baseVh,
          motivo: 'area-ainda-instavel',
          areaH,
          areaW,
          maxH: areaH,
          payloadAntes: capturarAntes('area-ainda-instavel', areaH),
          medicaoAntes,
        });
        return;
      }

      let usado = 0;
      let nOutros = 0;
      [elClockDigital, elClockAnalogWrap, elClockDate].forEach((el) => {
        if (!elementoRelogioVisivel(el)) return;
        nOutros += 1;
        usado += el.getBoundingClientRect().height;
      });
      const gaps = Math.max(0, nOutros) * pxGapWrapRelogio();
      const maxH = areaH - usado - gaps - 2;
      const payloadAntes = capturarAntes('medicao', maxH);
      const medicaoAntes = medirCabimentoVersiculoRelogio(elClockVerse, maxH);

      /* Orçamento absurdo (relógio maior que o wrap) = medição a meio; não encolher. */
      if (!(maxH >= 32)) {
        emitirDiagnosticoRelogio({
          wrap,
          quebra,
          baseVh,
          motivo: 'orcamento-altura-invalido',
          areaH,
          areaW,
          maxH,
          payloadAntes,
          medicaoAntes,
        });
        return;
      }

      if (versiculoRelogioCabeNaCaixa(elClockVerse, maxH)) {
        emitirDiagnosticoRelogio({
          wrap,
          quebra,
          baseVh,
          motivo: 'ja-cabia',
          areaH,
          areaW,
          maxH,
          payloadAntes,
          medicaoAntes,
        });
        return;
      }

      encolherFonteVersiculoRelogio(elClockVerse, baseVh, maxH);
      emitirDiagnosticoRelogio({
        wrap,
        quebra,
        baseVh,
        motivo: 'encolheu-por-overflow',
        areaH,
        areaW,
        maxH,
        payloadAntes,
        medicaoAntes,
      });
    }

    function tick() {
      const now = new Date();
      const clk = displayConfig.clock || {};
      const fmt = String(clk.format || 'HH:MM');
      const lowerFmt = fmt.toLowerCase();
      const color = corRelogio(clk);

      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');

      const analogico = lowerFmt === 'analog';
      elClockDigital.style.display = analogico || lowerFmt === 'none' ? 'none' : '';
      elClockAnalogWrap.style.display = analogico ? '' : 'none';

      if (lowerFmt === 'hh:mm:ss') {
        elClockDigital.textContent = `${h}:${m}:${s}`;
      } else if (lowerFmt !== 'none' && !analogico) {
        elClockDigital.textContent = `${h}:${m}`;
      } else {
        elClockDigital.textContent = '';
      }

      if (analogico) desenharRelogioAnalogico(now, color);

      if (clk.showDate) {
        elClockDate.textContent = now.toLocaleDateString('pt-BR', {
          weekday: 'long',
          day: '2-digit',
          month: 'long',
        });
        elClockDate.style.display = '';
      } else {
        elClockDate.textContent = '';
        elClockDate.style.display = 'none';
      }

      const verseTxt = clk.showVerse && clk.verse ? String(clk.verse) : '';
      const verseMudou =
        (elClockVerse.textContent || '') !== verseTxt ||
        (verseTxt ? elClockVerse.style.display === 'none' : elClockVerse.style.display !== 'none');
      if (verseTxt) {
        elClockVerse.textContent = verseTxt;
        elClockVerse.style.display = '';
      } else {
        elClockVerse.textContent = '';
        elClockVerse.style.display = 'none';
      }
      if (verseMudou) ajustarVersiculoRelogioAoEspaco();
    }

    ipcRenderer.on('display_config', (_, cfg) => aplicarConfig(cfg));
    let timerRefitRelogio = null;
    function reportarViewportRelogio() {
      if (!viewportDaJanela) return;
      const wrap = elClockVerse && elClockVerse.parentElement;
      viewportDaJanela.reportarViewportJanela('relogio', { elArea: wrap });
    }
    window.addEventListener('resize', () => {
      clearTimeout(timerRefitRelogio);
      timerRefitRelogio = setTimeout(() => {
        ajustarVersiculoRelogioAoEspaco();
        reportarViewportRelogio();
      }, 50);
    });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        ajustarVersiculoRelogioAoEspaco();
        reportarViewportRelogio();
      }).catch(() => {});
    }
    aplicarConfig(lerConfigDoArranque() || displayConfig);
    reportarViewportRelogio();
  </script>
</body>
</html>
