<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Lyra — OBS Slides</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-end;
    }

    /* ── FUNDO ──
       Altura é escrita diretamente via JS (elWrap.style.height), medida
       ANTES de cada troca — uma única transição limpa por mudança, sem
       observer contínuo e sem transform, para evitar o efeito de gangorra
       (dois movimentos verticais somados). */
    .slide-wrap {
      width: 100%;
      padding: 12px 40px;
      box-sizing: border-box;
      overflow: hidden;

      opacity: 0;
      height: 0px;
      pointer-events: none;
      transition: opacity 0.35s ease, height 0.35s ease;
    }

    .slide-wrap.projecao-ativa {
      opacity: 1;
      pointer-events: auto;
    }

    .slide-conteudo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      opacity: 1;
      transition: opacity 0.12s ease !important;
    }

    .slide-titulo {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: var(--obs-titulo-font-size, 1.6vw);
      font-weight: 600;
      color: #ffd76b;
      text-align: center;
      letter-spacing: 0.03em;
      text-shadow:
        0 2px 6px rgba(0,0,0,0.9),
        0 0 20px rgba(0,0,0,0.7);
      margin-bottom: 8px;
    }

    .slide-titulo:empty {
      display: none;
    }

    .slide-linhas {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slide-linha {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: var(--obs-font-size, 5vw);
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: var(--obs-line-spacing, 1.3);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      text-shadow:
        0 2px 8px rgba(0,0,0,0.9),
        0 0 32px rgba(0,0,0,0.7),
        2px 2px 0 rgba(0,0,0,0.5);
      white-space: pre-wrap;
      max-width: 92%;
    }

    /* Medidor: invisível, fora da tela, mesma tipografia. Serve só para
       calcular a altura real do próximo conteúdo antes de aplicá-lo. */
    #medidor {
      position: absolute;
      left: -9999px;
      top: -9999px;
      width: 100%;
      visibility: hidden;
      pointer-events: none;
    }

    #obs-status {
      display: none;
    }
  </style>
</head>
<body>
  <div class="slide-wrap" id="slide-wrap">
    <div class="slide-conteudo" id="slide-conteudo">
      <div class="slide-titulo" id="slide-titulo"></div>
      <div class="slide-linhas" id="slide-linhas"></div>
    </div>
  </div>

  <div id="medidor" aria-hidden="true">
    <div class="slide-conteudo" id="medidor-conteudo">
      <div class="slide-titulo" id="medidor-titulo"></div>
      <div class="slide-linhas" id="medidor-linhas"></div>
    </div>
  </div>

  <div id="obs-status"></div>

  <script>
    function resolverUrlServidorLyrics() {
      const qs = new URLSearchParams(window.location.search || '');
      const fromQuery = (qs.get('server') || '').trim();
      if (fromQuery) {
        if (/^https?:\/\//i.test(fromQuery)) return fromQuery.replace(/\/+$/, '');
        if (/^[\w.-]+:\d+$/i.test(fromQuery)) return `http://${fromQuery}`;
        return `http://${fromQuery.replace(/\/+$/, '')}:5510`;
      }
      try {
        const fromLs = (localStorage.getItem('lyra_obs_server_url') || '').trim();
        if (fromLs) {
          if (/^https?:\/\//i.test(fromLs)) return fromLs.replace(/\/+$/, '');
          if (/^[\w.-]+:\d+$/i.test(fromLs)) return `http://${fromLs}`;
          return `http://${fromLs.replace(/\/+$/, '')}:5510`;
        }
      } catch (_) {}
      const host = window.location.hostname || 'localhost';
      const proto = window.location.protocol === 'https:' ? 'https:' : 'http:';
      return `${proto}//${host}:5510`;
    }

    const SERVER_URL      = resolverUrlServidorLyrics();
    const elWrap           = document.getElementById('slide-wrap');
    const elConteudo         = document.getElementById('slide-conteudo');
    const elTitulo             = document.getElementById('slide-titulo');
    const elLinhas               = document.getElementById('slide-linhas');
    const elStatus                 = document.getElementById('obs-status');

    const elMedidorConteudo         = document.getElementById('medidor-conteudo');
    const elMedidorTitulo             = document.getElementById('medidor-titulo');
    const elMedidorLinhas               = document.getElementById('medidor-linhas');

    // 24px = padding vertical total do .slide-wrap (12px topo + 12px base).
    // Se o padding vertical mudar no Custom CSS do OBS, ajuste aqui também.
    const PADDING_VERTICAL = 24;

    let fadeTimer;
    let socket = null;
    let ultimoTitulo = null;
    let ultimasLinhas = null;

    function setStatus(msg, cls) {
      elStatus.textContent = msg;
      elStatus.className = cls ? cls : '';
    }

    function renderLinhasEm(container, linhas) {
      container.innerHTML = '';
      linhas.forEach((linha) => {
        const div = document.createElement('div');
        div.className = 'slide-linha';
        div.textContent = linha;
        container.appendChild(div);
      });
    }

    function conteudoIgual(titulo, linhas) {
      if (titulo !== ultimoTitulo) return false;
      if (!Array.isArray(ultimasLinhas)) return false;
      if (ultimasLinhas.length !== linhas.length) return false;
      return ultimasLinhas.every((l, i) => l === linhas[i]);
    }

    // Mede, de forma síncrona e isolada (fora da tela), a altura real que
    // o próximo conteúdo vai ocupar — sem depender de observers contínuos.
    function medirAlturaConteudo(titulo, linhas) {
      elMedidorTitulo.textContent = titulo;
      renderLinhasEm(elMedidorLinhas, linhas);
      return elMedidorConteudo.scrollHeight;
    }

    function atualizar(estado) {
      const ehSlide = !!estado && (estado.tipo === 'musica' || estado.tipo === 'aviso');
      const vazio =
        !ehSlide ||
        estado.telaLimpa ||
        estado.blackout ||
        estado.slidePretoFinal ||
        !Array.isArray(estado.linhas) ||
        estado.linhas.length === 0;

      clearTimeout(fadeTimer);

      if (vazio) {
        // Fundo E conteúdo saem juntos: só mexemos na opacidade do WRAP
        // (pai). Como .slide-conteudo é filho dele, some junto,
        // fisicamente amarrado — não tem como um sair antes do outro.
        elWrap.classList.remove('projecao-ativa');
        elConteudo.style.opacity = '1'; // garante que fica "pronto" pra próxima entrada

        fadeTimer = setTimeout(() => {
          elTitulo.textContent = '';
          renderLinhasEm(elLinhas, []);
          ultimoTitulo = null;
          ultimasLinhas = null;
          setStatus(`Ligado a ${SERVER_URL} — à espera de letra/slide.`, 'ok');
        }, 350); // precisa bater com "transition: opacity 0.35s" do .slide-wrap
        return;
      }

      const novoTitulo = estado.tipo === 'musica' ? (estado.titulo || '') : '';
      const jaEstavaAtivo = elWrap.classList.contains('projecao-ativa');

      if (jaEstavaAtivo && conteudoIgual(novoTitulo, estado.linhas)) {
        return;
      }

      const aplicarConteudoReal = () => {
        elTitulo.textContent = novoTitulo;
        renderLinhasEm(elLinhas, estado.linhas);
        ultimoTitulo = novoTitulo;
        ultimasLinhas = estado.linhas.slice();
        elConteudo.style.opacity = '1';
        setStatus(`Ligado a ${SERVER_URL}`, 'ok');
      };

      if (!jaEstavaAtivo) {
        // Início de uma nova projeção: fundo e texto entram juntos
        // (mesmo princípio — opacidade do texto já está em 1, o fundo
        // que faz o fade-in, e o filho aparece junto com ele).
        aplicarConteudoReal();
        elWrap.classList.add('projecao-ativa');
        return;
      }

      // Troca de slide na mesma projeção: só o texto faz um crossfade
      // rápido e sutil. O fundo (.projecao-ativa) não é tocado — fica
      // parado o tempo todo.
      elConteudo.style.opacity = '0';
      fadeTimer = setTimeout(aplicarConteudoReal, 90); // sai rápido...
    }

    function conectar() {
      if (!window.io) {
        setStatus('Falha: socket.io não carregou. Verifique ' + SERVER_URL, 'erro');
        return;
      }

      socket = io(SERVER_URL, {
        path: '/socket.io',
        transports: ['websocket', 'polling'],
        reconnectionDelay: 2000,
        reconnectionAttempts: Infinity,
      });

      socket.on('connect', () => {
        setStatus('Socket ligado — ' + SERVER_URL, 'ok');
        socket.emit('get_estado');
      });

      socket.on('connect_error', (err) => {
        setStatus(
          'Erro ao ligar a ' + SERVER_URL + ' — ' + (err && err.message ? err.message : 'rede/firewall?'),
          'erro'
        );
      });

      socket.on('estado', atualizar);

      socket.on('disconnect', () => {
        elConteudo.style.opacity = '0';
        elWrap.style.height = '0px';
        elWrap.classList.remove('projecao-ativa');
        setStatus('Desligado do servidor.', 'erro');
      });
    }

    function carregarSocketIO() {
      setStatus('A carregar socket.io de ' + SERVER_URL + ' …', '');
      const script = document.createElement('script');
      script.src = `${SERVER_URL}/socket.io/socket.io.js`;

      script.onload = () => conectar();

      script.onerror = () => {
        setStatus(
          'Não foi possível carregar ' + SERVER_URL + '/socket.io/socket.io.js (servidor a correr na 5510? Firewall?)',
          'erro'
        );
        setTimeout(carregarSocketIO, 3000);
      };

      document.head.appendChild(script);
    }

    setStatus('Página OBS Slides — API: ' + SERVER_URL, '');
    carregarSocketIO();
  </script>
</body>
</html>
