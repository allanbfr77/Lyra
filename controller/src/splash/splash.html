<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; font-src file:; style-src 'unsafe-inline'; script-src file:">
<title>Lyra</title>
<style>
@font-face { font-family: 'Instrument Serif'; src: url('../../public/fonts/instrument-serif-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Inter'; src: url('../../public/fonts/inter-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Inter'; src: url('../../public/fonts/inter-latin-500-normal.woff2') format('woff2'); font-weight: 500; font-display: swap; }
@font-face { font-family: 'JetBrains Mono'; src: url('../../public/fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }

:root {
  --bg: #000000;
  --border: rgba(196, 154, 58, 0.16);
  --fg: #E8E5E0;
  --muted: #8A8A92;
  --dim: #5E5E66;
  --gold: #C49A3A;
  --gold-lt: #E0B960;
  --warn: #D9A441;
  --crit: #E05A52;
  --track: rgba(232, 229, 224, 0.07);
}

* { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0; }
html, body { width: 520px; height: 320px; background: transparent; overflow: hidden; }
body { font-family: 'Inter', sans-serif; color: var(--fg); -webkit-user-select: none; user-select: none; -webkit-app-region: drag; }
button { -webkit-app-region: no-drag; }

.janela {
  position: relative; width: 520px; height: 320px;
  background: var(--bg);
  border: 1px solid var(--border);
  overflow: hidden;
}
.janela::before {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(140deg, rgba(232, 229, 224, .028) 0%, transparent 40%);
}
.janela.saindo { animation: sai 340ms cubic-bezier(.4, 0, 1, 1) both; }
@keyframes sai { to { opacity: 0; transform: scale(1.025); } }

/* Bloco central (230 px superiores) */
.centro {
  position: absolute; left: 0; right: 0; top: 0; height: 230px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.glow {
  position: absolute; width: 260px; height: 260px; left: 50%; top: 50%;
  margin: -140px 0 0 -130px;
  background: radial-gradient(circle, rgba(196, 154, 58, .17) 0%, rgba(196, 154, 58, .05) 42%, transparent 68%);
  animation: pulso 5s ease-in-out infinite alternate;
}
@keyframes pulso { from { transform: scale(1); } to { transform: scale(1.1); } }

.badge {
  position: relative; width: 94px; height: 94px;
  box-shadow: 0 14px 30px -8px rgba(0, 0, 0, .7);
  animation: badge-in 480ms cubic-bezier(.17, .72, .24, 1) both;
}
@keyframes badge-in {
  from { opacity: 0; transform: translateY(7px) scale(.93); }
  to { opacity: 1; transform: none; }
}
.badge img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
.rule { animation: regua 500ms ease-out 300ms both; }
@keyframes regua { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

.wordmark {
  position: relative; margin-top: 16px;
  font-family: 'Instrument Serif', serif; font-size: 27px; line-height: 1;
  letter-spacing: .26em; text-indent: .26em; color: var(--fg);
  animation: wordmark-in 550ms cubic-bezier(.17, .72, .24, 1) 620ms both;
}
@keyframes wordmark-in {
  from { opacity: 0; letter-spacing: .62em; text-indent: .62em; }
  to { opacity: 1; letter-spacing: .26em; text-indent: .26em; }
}

/* Rodapé */
.rodape {
  position: absolute; left: 0; right: 0; bottom: 2px;
  padding: 0 26px 19px;
  display: flex; justify-content: space-between; align-items: flex-end; gap: 20px;
  animation: fade-in 500ms ease-out 820ms both;
}
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }

.etapa { min-width: 0; max-width: 300px; }
.etapa-label {
  font-size: 11.5px; font-weight: 500; line-height: 1.35; color: var(--muted);
  transition: opacity 130ms ease, transform 130ms ease, color 130ms ease;
}
.etapa-label.troca { opacity: 0; transform: translateY(4px); }
.etapa-detalhe { margin-top: 3px; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1.4; color: var(--dim); min-height: 14px; }
.meta { text-align: right; font-size: 10px; line-height: 1.5; color: var(--dim); white-space: nowrap; }
.meta[hidden], .acoes[hidden] { display: none; }

.acoes { display: flex; gap: 8px; flex: none; }
.btn {
  font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500; color: var(--fg);
  background: transparent; border: 1px solid var(--border); padding: 6px 12px; cursor: pointer;
}
.btn:hover { border-color: var(--gold); }
.btn:focus-visible { outline: 1px solid var(--gold-lt); outline-offset: 2px; }
.btn-primario { background: var(--gold); border-color: var(--gold); color: #000; }
.btn-primario:hover { background: var(--gold-lt); border-color: var(--gold-lt); }

/* Barra */
.barra { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--track); overflow: hidden; }
.barra-fill {
  position: absolute; left: 0; top: 0; bottom: 0; width: 0;
  background: linear-gradient(90deg, #C49A3A, #E0B960);
  box-shadow: 0 0 10px rgba(196, 154, 58, .55);
  transition: width .45s cubic-bezier(.4, 0, .2, 1);
  overflow: hidden;
}
.barra-fill::after {
  content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .45), transparent);
  animation: shimmer 1.9s linear infinite;
}
@keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

/* Segmento indeterminado: desliza só na faixa ainda não concluída (left é ajustado pelo JS). */
.barra-indet { position: absolute; top: 0; bottom: 0; right: 0; left: 0; overflow: hidden; display: none; }
.barra-indet.ativo { display: block; }
.barra-indet i {
  position: absolute; top: 0; bottom: 0; left: 0; width: 22%; min-width: 24px;
  background: linear-gradient(90deg, transparent, rgba(196, 154, 58, .75), transparent);
  animation: indet 1.35s linear infinite;
}
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(460%); } }

/* Estados */
.janela.aviso .etapa-label { color: var(--warn); }
.janela.erro .etapa-label { color: var(--crit); }
.janela.erro .barra-fill { background: var(--crit); box-shadow: none; transition: none; }
.janela.erro .barra-fill::after { animation: none; display: none; }
.janela.erro .glow { animation: none; opacity: .35; }
.janela.erro .barra-indet { display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .janela.saindo { opacity: 0; }
}
</style>
</head>
