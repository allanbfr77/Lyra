# Antes de usar este workflow, crie um Personal Access Token (PAT) no GitHub
# com permissão de escrita em repositórios (scope "repo") e acesso ao repositório
# público allanbfr77/lyra-releases. Salve o token nas Actions Secrets deste
# repositório de código-fonte com o nome LYRA_RELEASES_TOKEN.
#
# Releases (instalador .exe, latest.yml e notas) são publicados em repositório
# separado do código-fonte: https://github.com/allanbfr77/lyra-releases
#
# Cada release do Controlador (tag vX.Y.Z) publica também o companion do Servidor:
# Lyra-Servidor-Setup.exe + server-latest.yml (buildId técnico, sem versão de produto).

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-controller-windows:
    name: Build e release (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            controller/package-lock.json
            server/package-lock.json

      # Não rode npm ci na raiz: better-sqlite3@12 (devDependency) exige compilar
      # nativo e o node-gyp falha no runner windows-latest (VS 2026). O catálogo
      # usa o better-sqlite3 do server (prebuilt); o controlador compila na etapa
      # electron-builder (--ignore-scripts evita gyp duplicado no npm ci).
      - name: Instalar dependências (servidor)
        run: npm ci
        working-directory: server

      - name: Instalar dependências (controlador)
        run: npm ci --ignore-scripts
        working-directory: controller

      - name: Sincronizar versão do Controlador com a tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          npm version $version --no-git-tag-version --allow-same-version --prefix controller

      - name: Gerar catálogo
        run: npm run catalog:build --prefix controller

      - name: Compilar instalador do Controlador
        env:
          INVB_SUPABASE_ANON_KEY: ${{ secrets.INVB_SUPABASE_ANON_KEY }}
        run: npm run build:win
        working-directory: controller

      - name: Gerar buildId técnico e compilar companion do Servidor
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}"
          $ver = "${{ github.ref_name }}".Substring(1)
          $env:LYRA_SERVER_BUILD_ID = $sha.Substring(0, [Math]::Min(12, $sha.Length))
          $env:LYRA_COMPATIBLE_CONTROLLER = ">=$ver"
          npm run build:win
        working-directory: server

      - name: Publicar release em allanbfr77/lyra-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: allanbfr77/lyra-releases
          token: ${{ secrets.LYRA_RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            controller/dist/*.exe
            controller/dist/latest.yml
            controller/dist/*.blockmap
            server/dist/Lyra-Servidor-Setup.exe
            server/dist/server-latest.yml
