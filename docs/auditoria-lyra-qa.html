<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Teste do Lyra Antes de Entregar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#faf8f4; --panel:#ffffff; --panel-2:#f3efe7; --sunk:#efeade;
  --ink:#1b1916; --ink-2:#4e483e; --ink-3:#827a6c;
  --line:#e0d9cb; --line-2:#cdc4b2;
  --brass:#8f6a22; --brass-soft:#f2e8d2;
  --ok:#2f7d4e; --warn:#a9770a; --bad:#a83228; --na:#7a7368;
  --ok-bg:#e6f2ea; --warn-bg:#fbf1d8; --bad-bg:#f9e6e3; --na-bg:#eeebe5;
  --m-prep:#6b6155; --m-abrir:#7a6a3a; --m-barra:#2d6f8a; --m-home:#8b7355;
  --m-musicas:#2d6f8a; --m-letras:#3a6f4e; --m-tom:#8b6225; --m-lista:#4a6fa5;
  --m-slides:#257956; --m-culto:#1c7a52; --m-biblia:#b24942; --m-midias:#735fa7;
  --m-avisos:#a05a2c; --m-contagem:#b5603a; --m-voz:#ac4676; --m-ajustes:#317283;
  --m-telas:#b03028; --m-janelas:#5b7c99; --m-rede:#2b7a6b; --m-salvar:#7a6a3a;
  --m-completo:#8c2f6d; --m-final:#1f1f1f; --m-dev:#5c5750;
  --shadow:0 1px 2px rgba(40,32,18,.05),0 8px 22px -14px rgba(40,32,18,.2);
  color-scheme:light;
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme:dark){
    --ground:#141317; --panel:#1c1b20; --panel-2:#232228; --sunk:#191820;
    --ink:#eceae4; --ink-2:#b6b0a5; --ink-3:#867f74;
    --line:#33313a; --line-2:#474450;
    --brass:#cda44e; --brass-soft:#3a3122;
    --ok:#57bd80; --warn:#dcae43; --bad:#e0736a; --na:#8d867b;
    --ok-bg:#1b2f24; --warn-bg:#332c17; --bad-bg:#33201e; --na-bg:#26252b;
    --m-prep:#a79a89; --m-abrir:#c3b06a; --m-barra:#67b3d4; --m-home:#c2a683;
    --m-musicas:#67b3d4; --m-letras:#6fbf90; --m-tom:#d1a250; --m-lista:#8aabdf;
    --m-slides:#5cc79b; --m-culto:#57cf9c; --m-biblia:#e58a83; --m-midias:#a894e0;
    --m-avisos:#d99a63; --m-contagem:#e29070; --m-voz:#e0839f; --m-ajustes:#6fb2c4;
    --m-telas:#e8756a; --m-janelas:#9bbad6; --m-rede:#5fbfad; --m-salvar:#c3b06a;
    --m-completo:#d47bb6; --m-final:#c9c4bb; --m-dev:#a09a92;
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -16px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#141317; --panel:#1c1b20; --panel-2:#232228; --sunk:#191820;
  --ink:#eceae4; --ink-2:#b6b0a5; --ink-3:#867f74;
  --line:#33313a; --line-2:#474450;
  --brass:#cda44e; --brass-soft:#3a3122;
  --ok:#57bd80; --warn:#dcae43; --bad:#e0736a; --na:#8d867b;
  --ok-bg:#1b2f24; --warn-bg:#332c17; --bad-bg:#33201e; --na-bg:#26252b;
  --m-prep:#a79a89; --m-abrir:#c3b06a; --m-barra:#67b3d4; --m-home:#c2a683;
  --m-musicas:#67b3d4; --m-letras:#6fbf90; --m-tom:#d1a250; --m-lista:#8aabdf;
  --m-slides:#5cc79b; --m-culto:#57cf9c; --m-biblia:#e58a83; --m-midias:#a894e0;
  --m-avisos:#d99a63; --m-contagem:#e29070; --m-voz:#e0839f; --m-ajustes:#6fb2c4;
  --m-telas:#e8756a; --m-janelas:#9bbad6; --m-rede:#5fbfad; --m-salvar:#c3b06a;
  --m-completo:#d47bb6; --m-final:#c9c4bb; --m-dev:#a09a92;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px -16px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Archivo,"Segoe UI",system-ui,sans-serif;font-size:15.5px;line-height:1.6;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
code,kbd,.mono{font-family:"JetBrains Mono",ui-monospace,Consolas,monospace}

.topbar{position:sticky;top:0;z-index:40;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:10px 22px}
.brandmark{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brandmark b{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brandmark span{font-size:11.5px;color:var(--ink-3);letter-spacing:.09em;text-transform:uppercase}
.meter{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2)}
.meter .bar{width:190px;height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;display:flex}
.meter .bar i{display:block;height:100%}
.meter .bar .s-ok{background:var(--ok)}.meter .bar .s-warn{background:var(--warn)}
.meter .bar .s-bad{background:var(--bad)}.meter .bar .s-na{background:var(--na)}
.meter b{font-variant-numeric:tabular-nums;color:var(--ink)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button.tool{font:inherit;font-size:13px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);cursor:pointer}
button.tool:hover{border-color:var(--brass);color:var(--brass)}
button.tool[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr)}
.rail{position:sticky;top:57px;max-height:calc(100vh - 57px);overflow:auto;
  border-right:1px solid var(--line);padding:16px 12px 40px;background:var(--panel)}
.rail h4{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:14px 8px 7px}
.rail a{display:grid;grid-template-columns:3px 1fr auto;gap:9px;align-items:center;
  text-decoration:none;color:var(--ink-2);font-size:13.4px;padding:5px 8px;border-radius:7px}
.rail a i.tick{display:block;height:16px;border-radius:2px;background:var(--acc)}
.rail a:hover{background:var(--panel-2);color:var(--ink)}
.rail a.on{background:var(--panel-2);color:var(--ink);font-weight:600}
.rail a em{font-style:normal;font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}
main{padding:26px 34px 120px;min-width:0;max-width:1000px}

.lede{border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:26px}
.lede h1{font-family:Fraunces,Georgia,serif;font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.08}
.lede p.sub{margin:12px 0 0;color:var(--ink-2);max-width:60ch;font-size:16.5px}

.howto{border:1px solid var(--line);background:var(--panel);border-radius:12px;
  padding:18px 20px;margin:22px 0 6px;box-shadow:var(--shadow)}
.howto h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.howto ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:7px}
.howto li{font-size:14.6px;color:var(--ink-2)}
.howto li b{color:var(--ink)}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:15px;border-top:1px dashed var(--line)}
.legend div{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:baseline;font-size:14px;color:var(--ink-2)}
.legend .lb{font-size:9.8px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink-3)}
.legend .lb.f{color:var(--brass)}.legend .lb.d{color:var(--ok)}.legend .lb.x{color:var(--bad)}
.factbar{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:20px}
.fact{display:flex;gap:7px;align-items:baseline;font-size:12.5px;padding:5px 10px;
  border:1px solid var(--line);border-radius:99px;background:var(--panel)}
.fact b{color:var(--ink);font-variant-numeric:tabular-nums}
.fact span{color:var(--ink-3)}

section.mod{margin:0 0 36px;scroll-margin-top:70px}
.modhead{display:grid;grid-template-columns:4px 1fr;gap:14px;border-bottom:1px solid var(--line);
  padding-bottom:13px;margin-bottom:16px}
.modhead .rail-color{background:var(--acc);border-radius:99px}
.modhead h2{font-family:Fraunces,Georgia,serif;font-size:25px;font-weight:700;letter-spacing:-.01em;
  display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.modhead h2 .num{font-family:"JetBrains Mono",monospace;font-size:12px;font-weight:600;
  color:var(--acc);letter-spacing:.06em;padding-top:4px}
.modhead p{margin:7px 0 0;color:var(--ink-2);font-size:15px;max-width:68ch}
.modstat{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);
  color:var(--ink-3);font-variant-numeric:tabular-nums}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.pill.warn{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}

h3.blk{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);
  margin:24px 0 10px;padding-bottom:5px;border-bottom:1px dashed var(--line)}

.note{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;
  padding:13px 16px;font-size:14.6px;color:var(--ink-2);margin:0 0 18px}
.note b{color:var(--ink)}

ul.tem{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;
  border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
ul.tem li{flex:1 1 270px;padding:10px 13px;font-size:14px;color:var(--ink-2);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
ul.tem li b{display:block;color:var(--ink);font-weight:600;font-size:14.2px;margin-bottom:1px}

ol.tests{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
li.t{border:1px solid var(--line);border-radius:10px;background:var(--panel);
  padding:12px 15px;box-shadow:var(--shadow)}
li.t[data-st="ok"]{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
li.t[data-st="bad"]{border-color:var(--bad);background:linear-gradient(92deg,var(--bad-bg),var(--panel) 50%)}
li.t[data-st="warn"]{border-color:color-mix(in srgb,var(--warn) 50%,var(--line))}
li.t[data-st="na"]{opacity:.6}
.thead{display:flex;align-items:baseline;gap:9px;margin-bottom:8px;flex-wrap:wrap}
.thead .tid{font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.thead .must{font-size:9.6px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  color:var(--bad);background:var(--bad-bg);border-radius:99px;padding:2px 8px}
.lines{display:flex;flex-direction:column;gap:6px}
.lines .ln{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:baseline}
.lines .ln>b{font-size:9.8px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;
  color:var(--ink-3);padding-top:4px}
.lines .ln>span{font-size:15px;color:var(--ink)}
.lines .ln.f>b{color:var(--brass)}
.lines .ln.d>b{color:var(--ok)}   .lines .ln.d>span{color:var(--ink-2)}
.lines .ln.x>b{color:var(--bad)}  .lines .ln.x>span{color:var(--ink-2)}
.trow{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap}
.seg{display:flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-size:11.6px;font-weight:500;padding:4px 11px;border:0;cursor:pointer;
  background:var(--panel-2);color:var(--ink-3);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"][data-v="ok"]{background:var(--ok);color:#fff}
.seg button[aria-pressed="true"][data-v="warn"]{background:var(--warn);color:#241c05}
.seg button[aria-pressed="true"][data-v="bad"]{background:var(--bad);color:#fff}
.seg button[aria-pressed="true"][data-v="na"]{background:var(--na);color:#fff}
input.nota{flex:1;min-width:160px;font:inherit;font-size:13px;padding:5px 10px;
  border:1px solid var(--line);border-radius:7px;background:var(--sunk);color:var(--ink)}
input.nota::placeholder{color:var(--ink-3)}
li.t code{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px;font-size:12.4px}
kbd{background:var(--sunk);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;
  padding:0 5px;font-size:12.4px}

ul.risks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.risks li{font-size:14.6px;color:var(--ink-2);border-left:3px solid var(--acc);padding:4px 0 4px 13px}
ul.risks li b{color:var(--ink)}
ul.flows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.flows li{font-size:14.6px;color:var(--ink-2);padding-left:18px;position:relative}
ul.flows li::before{content:"→";position:absolute;left:0;color:var(--acc);font-weight:700}

.finding{border:1px solid var(--line);border-left:3px solid var(--acc);border-radius:10px;
  background:var(--panel);padding:14px 16px;margin-bottom:11px}
.finding h4{font-size:15.4px;margin-bottom:7px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.finding h4 .sev{font-size:9.6px;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:99px}
.sev.grave{background:var(--bad-bg);color:var(--bad)}
.sev.medio{background:var(--warn-bg);color:var(--warn)}
.sev.leve{background:var(--na-bg);color:var(--ink-3)}
.sev.bom{background:var(--ok-bg);color:var(--ok)}
.finding p{margin:0 0 7px;font-size:14.6px;color:var(--ink-2)}
.finding p.tech{font-size:13.2px;color:var(--ink-3);border-top:1px dashed var(--line);padding-top:8px;margin-bottom:0}
.finding p.tech b{color:var(--ink-2)}
.savestate{font-size:11.5px;color:var(--ink-3);min-width:104px;text-align:right}

@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
  main{padding:20px 18px 90px}
  .lede h1{font-size:29px}
  .lines .ln,.legend div{grid-template-columns:1fr;gap:2px}
  .lines .ln>b{padding-top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header class="topbar">
  <div class="brandmark"><b>Teste do Lyra</b><span>antes de entregar · v1.1.1</span></div>
  <div class="meter">
    <div class="bar" id="bar" role="img" aria-label="Progresso do teste">
      <i class="s-ok" id="b-ok"></i><i class="s-warn" id="b-warn"></i><i class="s-bad" id="b-bad"></i><i class="s-na" id="b-na"></i>
    </div>
    <span><b id="m-done">0</b>/<b id="m-tot">0</b> feitos · <b id="m-bad" style="color:var(--bad)">0</b> com problema</span>
  </div>
  <div class="tools">
    <button class="tool" id="f-must" aria-pressed="false" title="Mostrar só os testes obrigatórios">Só obrigatórios</button>
    <button class="tool" id="f-open" aria-pressed="false" title="Mostrar só o que ainda não foi testado">Só o que falta</button>
    <button class="tool" id="f-bad" aria-pressed="false" title="Mostrar só o que deu problema">Só problemas</button>
    <button class="tool" id="btn-export" title="Baixar a lista de resultados">Baixar resultado</button>
    <button class="tool" id="btn-reset" title="Apagar todas as marcações">Zerar</button>
    <span class="savestate" id="savestate">local</span>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Partes do programa"></nav>
  <main id="main"></main>
</div>

{
id:"dev", nome:"Para quem mexe no código", cor:"dev",
oque:"O que a leitura do código encontrou, antes de qualquer teste. Esta parte é a única com linguagem técnica — se você não programa, pode pular, mas vale mandar ela para quem for consertar.",
nota:"Cada item aqui é uma **suspeita**, não um erro confirmado. Código correto não prova comportamento correto: é por isso que cada suspeita indica qual teste da lista confirma ou descarta ela.",
achados:[
 {sev:"grave", t:"1 · Encerrar os slides pode não limpar a TV do ministrante",
  d:"Quando você aperta [[Esc]] ou clica no X da barra, o programa manda o comando de limpar a tela do público. No motor de projeção, esse comando limpa o estado do telão mas **não mexe** no estado do ministrante, e não manda redesenhar a janela dele. Só o comando de «encerrar tudo» limpa os dois. Na prática, a TV depende de um observador que reage às prévias do painel com meio segundo de atraso — e esse observador tem três condições que podem impedi-lo de mandar. **Confirme com os testes BAR-6, CUL-9 e FIN-10.**",
  tec:"`commandApplier.js:424` (`limpar_tela`) → `projectionEncerrar.js` (`encerrarCamadaSlides`) não toca em `ctx.estadoMinistrante` nem chama `engine.atualizarDisplayMinistrante()`. O painel envia `limpar_tela` em `controllerAppCore.js:18414`. A limpeza da TV depende do `MutationObserver` (40 ms) sobre `#op-atual`/`#op-proximo` → `emitirEstadoMinistranteAoServidor()`, que retorna cedo em três guardas."},
 {sev:"grave", t:"2 · O mesmo padrão ao encerrar a Bíblia",
  d:"Encerrar a projeção bíblica limpa o telão e limpa a TV **apenas se** ela estivesse mostrando conteúdo bíblico. Se estivesse mostrando outra coisa, aquilo continua. Pode ser de propósito (camadas independentes), mas precisa de confirmação visual. **Confirme com o teste BIB-12.**",
  tec:"`projectionEncerrar.js` (`encerrarCamadaBiblia`) só anula `ministranteApresentacaoOverride` quando `.modo === 'biblia'`. Ver `commandApplier.js:431`."},
 {sev:"medio", t:"3 · Seis testes automáticos falham fora do Windows",
  d:"A suíte do repositório deu **712 de 718** nesta auditoria. As seis falhas são de resolução dos pacotes internos do projeto e acontecem porque a máquina que fez a auditoria não lê os atalhos de pasta criados pelo Windows. Não é defeito do produto — mas **é obrigatório rodar `npm test` no PC de desenvolvimento** antes de gerar o instalador, para confirmar 718 de 718.",
  tec:"`MODULE_NOT_FOUND` de `@lyra/projection-core` e `@lyra/letras-fontes` em: `controller/src/lib/{cifraLetras,indiceMusicasBusca,lyraSongbank}.test.js`, `server/src/windowsHost.test.js`, `server/src/lib/projectionState.test.js`."},
 {sev:"medio", t:"4 · A janela «Atalhos de teclado» está desatualizada",
  d:"O passador de slides aceita mais teclas do que a ajuda mostra: os números 3 e 8 do teclado numérico e as teclas de mídia de faixa anterior/seguinte. E o menu do programa define [[F9]] para a verificação de véspera e [[Ctrl+H]] para o histórico, que também não aparecem na tabela. Quem lê só a ajuda não descobre metade do que existe. **Confirme com os testes CUL-3 e JAN-7.**",
  tec:"`direcaoTeclaPassadorSlides()` em `controllerAppCore.js:18121` aceita `Numpad3`, `Numpad8`, `MediaTrackNext`, `MediaTrackPrevious` — ausentes de `LYRA_SHORTCUT_GROUPS`. Aceleradores em `mainWindow.js:405,411`."},
 {sev:"medio", t:"5 · A limpeza de janelinhas ao trocar de modo conhece só sete delas",
  d:"A função que fecha tudo ao trocar de modo enumera sete janelinhas por nome. O painel tem hoje pelo menos catorze. Algumas têm o seu próprio jeito de fechar, mas vale confirmar uma por uma que nenhuma sobrevive à troca de modo — uma janelinha invisível que fica na frente bloqueia todos os cliques. **Confirme com os testes JAN-8 e JAN-10.**",
  tec:"`liberarBloqueioUiModos()` em `controllerAppCore.js:284` lista `slide-quick-edit`, `slide-nota`, `slide-delete-confirm`, `letras-preview`, `musica-excluir`, `nova-musica-manual`, `culto-calendario`. Fora da lista: `sync-playlist`, `confirmar-import`, `conflito-import`, `prevoo`, `contagem`, `lyra-menu`, `app-dialog`, `cfg-modal`."},
 {sev:"medio", t:"6 · Quatro erros de análise de código sem resolver",
  d:"O verificador de código acusa 4 erros e 287 avisos. Os erros são três blocos de tratamento de erro vazios na geometria dos quadradinhos de slide, e um laço de repetição na sincronização de tons que não tem limite de voltas — se o servidor responder de forma inesperada, ele pode ficar girando. Os 287 avisos são quase todos de estilo de comparação; são dívida aceitável, mas vale decidir isso por escrito antes de entregar.",
  tec:"`no-empty` em `controller/public/js/modules/slidesGrelha.js:211,466,480`. `no-constant-condition` em `controller/src/lib/invbTonsFromSupabase.js:503` — `while(true)` cuja saída depende de o Supabase honrar o cabeçalho `Range`. 287 avisos `eqeqeq`."},
 {sev:"leve", t:"7 · Uma variável declarada e nunca usada no motor de projeção",
  d:"Num arquivo de 123 KB que foi mexido no último dia, existe uma variável criada e nunca utilizada. Vale conferir se é resto de uma reorganização do código ou se é lógica que ficou por conectar.",
  tec:"`_routingDual` em `packages/projection-core/src/projectionEngine.js:1500`."},
 {sev:"leve", t:"8 · Os ajustes de desempenho do banco falham em silêncio",
  d:"O programa tenta ligar um modo de gravação mais rápido no banco de músicas. Se falhar, só grava um aviso no registro interno e ninguém percebe — o sintoma é o programa ficar lento ao importar músicas, especialmente em computador com disco antigo. Dá para confirmar se está ligado olhando se aparece um arquivo terminado em `-wal` ao lado do banco.",
  tec:"`aplicarPragmasDesempenho()` em `controller/src/db.js:138` envolve `pragma('journal_mode = WAL')` num `try/catch` com `console.warn`."},
 {sev:"bom", t:"9 · Nenhuma marca de trabalho inacabado no código",
  d:"Uma varredura por marcas de trabalho pendente (`TODO`, `FIXME`, `HACK`, `BUG`) em todo o código de produção não achou nenhuma. É um bom sinal: não há função conscientemente deixada pela metade.",
  tec:"Varredura em `controller/src`, `controller/public/js`, `packages/*/src` e `server/src`: zero resultados."},
 {sev:"bom", t:"10 · As proteções contra piscar e tela errada já estão no código",
  d:"O motor de projeção já implementa, e documenta, todas as defesas clássicas: a janela nasce invisível e preta, não usa tela cheia exclusiva do Windows (só se encaixa no retângulo do monitor), espera o Windows confirmar que pintou preto antes de aparecer, e usa uma janela-escudo preta na transição. A parte «Telas, TV e projetor» desta lista serve para confirmar que continuam funcionando depois das mudanças recentes, não para descobrir se existem.",
  tec:"`packages/projection-core/src/projectionEngine.js` — `show:false`, `backgroundColor` preto nativo, sem `fullscreen`, `ready-to-show` + 2 rAF antes de `showInactive()`, ciclo de topo só com `moveTop()`."}
],
olho:[
 "**Arquivos mexidos nas 48 h antes desta auditoria** (maior risco de problema novo): o painel principal, o HTML e o CSS do painel, o motor de projeção, a tela do ministrante, o desenho da projeção pública, tons e ministrantes, a fonte de busca de letras, a rolagem de versículos, a grelha de slides, as mídias, a conexão, o banco e todas as rotas internas. Priorize os testes das partes correspondentes.",
 "**Nenhum teste automático toca em janelas, monitores ou escala do Windows.** A parte «Telas, TV e projetor» é obrigatoriamente manual, e é a de maior risco do produto.",
 "O painel expõe cerca de 997 funções para os botões do HTML chamarem por nome. Uma renomeação quebraria um botão em silêncio. Uma verificação automática que compare os nomes usados nos botões com os expostos pelo código seria uma rede de segurança barata."
],
junto:[
 "Depois de consertar qualquer item desta parte, refaça os testes da parte correspondente **e** a parte «Ensaio de culto completo» inteira — consertos em ciclo de vida costumam mover o problema, não removê-lo."
]
}

]/*FIMDADOS*/;
</script>
<script>
const LS='lyra_teste_simples_v1';
let estado={},dbDoc=null,salvarTimer=null;
function lerLocal(){try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(_){return{}}}
function gravarLocal(){try{localStorage.setItem(LS,JSON.stringify(estado))}catch(_){}}
function agendarGravar(){gravarLocal();if(!dbDoc)return;clearTimeout(salvarTimer);
  salvarTimer=setTimeout(()=>{dbDoc.set({itens:estado,atualizadoEm:new Date().toISOString()}).catch(()=>sinal('só neste PC'))},700)}
function sinal(t){const e=document.getElementById('savestate');if(e)e.textContent=t}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rich(s){return esc(s)
  .replace(/`([^`]+)`/g,'<code>$1</code>')
  .replace(/\[\[([^\]]+)\]\]/g,'<kbd>$1</kbd>')
  .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')}

function renderSecao(sec,i){
  const n=String(i+1).padStart(2,'0');
  let h=`<section class="mod" id="s-${sec.id}" style="--acc:var(--m-${sec.cor})">
    <div class="modhead"><div class="rail-color"></div><div>
      <h2><span class="num">${n}</span>${esc(sec.nome)}</h2>
      <p>${rich(sec.oque)}</p><div class="modstat" id="stat-${sec.id}"></div>
    </div></div>`;
  if(sec.nota) h+=`<div class="note">${rich(sec.nota)}</div>`;
  if(sec.tem&&sec.tem.length){
    h+=`<h3 class="blk">O que tem nesta parte</h3><ul class="tem">`;
    for(const t of sec.tem) h+=`<li><b>${rich(t.n)}</b>${rich(t.o)}</li>`;
    h+=`</ul>`;
  }
  if(sec.itens&&sec.itens.length){
    h+=`<h3 class="blk">Testes — marque o resultado de cada um</h3><ol class="tests">`;
    for(const t of sec.itens){
      h+=`<li class="t" data-id="${t.id}" data-must="${t.p?1:0}" data-st="">
        <div class="thead"><span class="tid">${t.id}</span>${t.p?'<span class="must">obrigatório</span>':''}</div>
        <div class="lines">
          <div class="ln f"><b>Faça</b><span>${rich(t.f)}</span></div>
          <div class="ln d"><b>Deve acontecer</b><span>${rich(t.d)}</span></div>
          ${t.x?`<div class="ln x"><b>Está errado se</b><span>${rich(t.x)}</span></div>`:''}
        </div>
        <div class="trow">
          <div class="seg" role="group" aria-label="Resultado de ${t.id}">
            <button data-v="ok" aria-pressed="false" title="Funcionou">Funcionou</button>
            <button data-v="warn" aria-pressed="false" title="Funcionou, mas com algo estranho">Estranho</button>
            <button data-v="bad" aria-pressed="false" title="Não funcionou">Deu erro</button>
            <button data-v="na" aria-pressed="false" title="Não consigo testar aqui">Não testei</button>
          </div>
          <input class="nota" placeholder="O que você viu? (monitor, hora, o que fez antes…)" aria-label="Nota de ${t.id}">
        </div></li>`;
    }
    h+=`</ol>`;
  }
  if(sec.olho&&sec.olho.length){
    h+=`<h3 class="blk">Fique de olho</h3><ul class="risks">`;
    for(const p of sec.olho) h+=`<li>${rich(p)}</li>`;
    h+=`</ul>`;
  }
  if(sec.achados&&sec.achados.length){
    h+=`<h3 class="blk">Detalhe técnico</h3>`;
    for(const a of sec.achados){
      h+=`<div class="finding"><h4>${esc(a.t)}<span class="sev ${a.sev}">${a.sev}</span></h4>
        <p>${rich(a.d)}</p>${a.tec?`<p class="tech">${rich(a.tec)}</p>`:''}</div>`;
    }
  }
  if(sec.junto&&sec.junto.length){
    h+=`<h3 class="blk">Teste junto com outras partes</h3><ul class="flows">`;
    for(const f of sec.junto) h+=`<li>${rich(f)}</li>`;
    h+=`</ul>`;
  }
  return h+`</section>`;
}

function montar(){
  const tot=DADOS.reduce((a,s)=>a+(s.itens?s.itens.length:0),0);
  const must=DADOS.reduce((a,s)=>a+(s.itens||[]).filter(i=>i.p).length,0);
  document.getElementById('main').innerHTML=
   `<div class="lede">
      <h1>Teste do Lyra antes de entregar</h1>
      <p class="sub">Uma lista de coisas para fazer no programa e conferir se o resultado é o certo.
      Não precisa entender de programação: cada teste diz <b>o que fazer</b>, <b>o que deve acontecer</b>
      e <b>o que significa estar errado</b>.</p>
      <div class="howto">
        <h3>Como usar esta lista</h3>
        <ol>
          <li>Ligue <b>dois monitores</b> (ou um monitor e a TV/projetor) antes de começar. Boa parte dos testes só faz sentido com telas de verdade ligadas.</li>
          <li>Vá de cima para baixo. Faça o que está escrito em <b>Faça</b> e compare com <b>Deve acontecer</b>.</li>
          <li>Marque o resultado no botão. Se algo der errado, escreva na caixa de nota <b>o que você viu e o que fez antes</b> — isso é o que permite consertar depois.</li>
          <li>Os testes marcados <b>obrigatório</b> são os que não podem falhar. Se um deles der erro, o programa não está pronto para entregar.</li>
          <li>Ao terminar, clique em <b>Baixar resultado</b> para guardar um arquivo com tudo o que você marcou.</li>
        </ol>
        <div class="legend">
          <div><span class="lb f">Faça</span><span>A ação, passo a passo. Faça exatamente isso.</span></div>
          <div><span class="lb d">Deve acontecer</span><span>O resultado correto. Se foi isso, marque <b>Funcionou</b>.</span></div>
          <div><span class="lb x">Está errado se</span><span>O sinal de problema. Se viu isso, marque <b>Deu erro</b> e escreva a nota.</span></div>
        </div>
      </div>
      <div class="factbar">
        <span class="fact"><b>${DADOS.length}</b><span>partes do programa</span></span>
        <span class="fact"><b>${tot}</b><span>testes</span></span>
        <span class="fact"><b>${must}</b><span>obrigatórios</span></span>
      </div>
    </div>`+DADOS.map(renderSecao).join('');
  document.getElementById('rail').innerHTML=`<h4>Partes do programa</h4>`+DADOS.map(s=>
    `<a href="#s-${s.id}" data-id="${s.id}" style="--acc:var(--m-${s.cor})"><i class="tick"></i><span>${esc(s.nome)}</span><em id="rail-${s.id}"></em></a>`).join('');
  document.getElementById('m-tot').textContent=tot;
}

function aplicarEstadoNoDom(){
  document.querySelectorAll('li.t').forEach(li=>{
    const e=estado[li.dataset.id]||{};
    li.dataset.st=e.s||'';
    li.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===e.s?'true':'false'));
    const inp=li.querySelector('input.nota');
    if(document.activeElement!==inp) inp.value=e.n||'';
  });
  recalcular();aplicarFiltros();
}
function recalcular(){
  let ok=0,warn=0,bad=0,na=0,tot=0;
  for(const sec of DADOS){
    let so=0,sw=0,sb=0,sn=0;const st=(sec.itens||[]).length;
    for(const t of (sec.itens||[])){const s=(estado[t.id]||{}).s;
      if(s==='ok')so++;else if(s==='warn')sw++;else if(s==='bad')sb++;else if(s==='na')sn++}
    ok+=so;warn+=sw;bad+=sb;na+=sn;tot+=st;
    const feito=so+sw+sb+sn;
    const r=document.getElementById('rail-'+sec.id);
    if(r){r.textContent=st?(feito+'/'+st):'';r.style.color=sb?'var(--bad)':(feito===st&&st?'var(--ok)':'')}
    const stat=document.getElementById('stat-'+sec.id);
    if(stat) stat.innerHTML=(st?`<span class="pill">${st} testes</span>`:'')+
      (so?`<span class="pill ok">${so} ok</span>`:'')+
      (sw?`<span class="pill warn">${sw} estranho</span>`:'')+
      (sb?`<span class="pill bad">${sb} erro</span>`:'')+
      (sn?`<span class="pill">${sn} não testei</span>`:'');
  }
  const done=ok+warn+bad+na;
  document.getElementById('m-done').textContent=done;
  document.getElementById('m-bad').textContent=bad;
  const p=v=>tot?(v/tot*100).toFixed(2)+'%':'0%';
  document.getElementById('b-ok').style.width=p(ok);
  document.getElementById('b-warn').style.width=p(warn);
  document.getElementById('b-bad').style.width=p(bad);
  document.getElementById('b-na').style.width=p(na);
}
let fOpen=false,fBad=false,fMust=false;
function aplicarFiltros(){
  document.querySelectorAll('li.t').forEach(li=>{
    const s=(estado[li.dataset.id]||{}).s;let m=true;
    if(fMust && li.dataset.must!=='1') m=false;
    if(fOpen && s) m=false;
    if(fBad && !(s==='bad'||s==='warn')) m=false;
    li.hidden=!m;
  });
  document.querySelectorAll('section.mod').forEach(sec=>{
    const itens=sec.querySelectorAll('li.t');if(!itens.length)return;
    sec.hidden=(fOpen||fBad||fMust)&&![...itens].some(li=>!li.hidden);
  });
}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('.seg button');if(!b)return;
  const li=b.closest('li.t'),id=li.dataset.id,v=b.dataset.v;
  const atual=(estado[id]||{}).s;
  estado[id]=Object.assign({},estado[id],{s:atual===v?'':v});
  if(!estado[id].s&&!estado[id].n) delete estado[id];
  agendarGravar();aplicarEstadoNoDom();
});
document.addEventListener('input',ev=>{
  const inp=ev.target.closest('input.nota');if(!inp)return;
  const id=inp.closest('li.t').dataset.id;
  estado[id]=Object.assign({},estado[id],{n:inp.value});
  if(!estado[id].s&&!estado[id].n) delete estado[id];
  agendarGravar();recalcular();
});
function botaoFiltro(idBtn,setter){
  document.getElementById(idBtn).addEventListener('click',()=>{
    setter();
    document.getElementById('f-must').setAttribute('aria-pressed',fMust);
    document.getElementById('f-open').setAttribute('aria-pressed',fOpen);
    document.getElementById('f-bad').setAttribute('aria-pressed',fBad);
    aplicarFiltros();
  });
}
botaoFiltro('f-must',()=>{fMust=!fMust});
botaoFiltro('f-open',()=>{fOpen=!fOpen;if(fOpen)fBad=false});
botaoFiltro('f-bad',()=>{fBad=!fBad;if(fBad)fOpen=false});
document.getElementById('btn-reset').addEventListener('click',()=>{
  if(!confirm('Apagar todas as marcações?'))return;
  estado={};agendarGravar();aplicarEstadoNoDom();
});
const obs=new IntersectionObserver(es=>{for(const e of es){if(!e.isIntersecting)continue;
  const id=e.target.id.replace(/^s-/,'');
  document.querySelectorAll('.rail a').forEach(a=>a.classList.toggle('on',a.dataset.id===id))}},
  {rootMargin:'-70px 0px -75% 0px'});

function relatorio(){
  const L=['# Teste do Lyra — resultado',''];
  L.push('Data: '+new Date().toLocaleString('pt-BR'),'');
  let ok=0,warn=0,bad=0,na=0,tot=0;
  for(const s of DADOS) for(const t of (s.itens||[])){tot++;const v=(estado[t.id]||{}).s;
    if(v==='ok')ok++;else if(v==='warn')warn++;else if(v==='bad')bad++;else if(v==='na')na++}
  L.push(`${ok+warn+bad+na} de ${tot} testes feitos — ${ok} funcionaram, ${warn} estranhos, ${bad} com erro, ${na} não testados.`,'');
  const problemas=[];
  for(const s of DADOS){
    const feitos=(s.itens||[]).filter(t=>estado[t.id]&&estado[t.id].s);
    if(!feitos.length)continue;
    L.push('## '+s.nome,'');
    for(const t of feitos){
      const e=estado[t.id];
      const rot={ok:'FUNCIONOU',warn:'ESTRANHO',bad:'DEU ERRO',na:'NÃO TESTEI'}[e.s]||'—';
      L.push(`- **[${rot}] ${t.id}${t.p?' (obrigatório)':''}** — ${t.f}`);
      if(e.n) L.push(`  - Nota: ${e.n}`);
      if(e.s==='bad'||e.s==='warn') problemas.push(`- [${rot}] ${t.id} — ${s.nome} — ${t.f}${e.n?` — ${e.n}`:''}`);
    }
    L.push('');
  }
  if(problemas.length) L.push('## Consertar antes de entregar','',...problemas,'');
  const naoFeitos=[];
  for(const s of DADOS) for(const t of (s.itens||[])) if(t.p && !(estado[t.id]&&estado[t.id].s)) naoFeitos.push(`- ${t.id} — ${s.nome} — ${t.f}`);
  if(naoFeitos.length) L.push('## Obrigatórios ainda não testados','',...naoFeitos,'');
  return L.join('\n');
}
document.getElementById('btn-export').addEventListener('click',async()=>{
  const md=relatorio(),nome='teste-lyra-'+new Date().toISOString().slice(0,10)+'.md';
  try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:nome,data:md});return}}catch(_){}
  try{await navigator.clipboard.writeText(md);alert('Resultado copiado. Cole num arquivo de texto para guardar.')}
  catch(_){alert('Não foi possível baixar nem copiar aqui.')}
});

montar();
estado=lerLocal();
aplicarEstadoNoDom();
document.querySelectorAll('section.mod').forEach(s=>obs.observe(s));
(async()=>{
  let db=null;try{db=await claude.use('db')}catch(_){}
  if(!db){sinal('só neste PC');return}
  dbDoc=db.doc('qa/simples');sinal('salvo na conta');
  dbDoc.onSnapshot(snap=>{
    if(!snap.exists||snap.metadata.hasPendingWrites)return;
    const itens=(snap.data()||{}).itens;
    if(!itens||typeof itens!=='object')return;
    estado=itens;gravarLocal();aplicarEstadoNoDom();
  },()=>{dbDoc=null;sinal('só neste PC')});
})();
</script>
